<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPE Addon - Đỉnh Cao</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === THEME & VARIABLES === */
        :root {
            --bg-base: #030305;
            --glass-panel: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neon-accent: #00e5ff;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            /* Role Colors */
            --color-dev: #ff2a2a;
            --color-admin: #ff9d00;
            --color-glx: #00e5ff;
            --color-guest: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); overflow-x: hidden; min-height: 100vh; padding-bottom: 100px; }
        button { cursor: pointer; outline: none; }

        /* === HIỆU ỨNG NỀN & LOADING === */
        .ambient-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 30, 80, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 30%);
            z-index: -1; animation: drift 20s infinite linear alternate;
        }
        @keyframes drift { 100% { transform: rotate(5deg) scale(1.1); } }

        #preloader { position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: 0.6s; }
        .loader-text { font-size: 3rem; font-weight: 900; background: linear-gradient(to right, #fff, var(--neon-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse-glow 1.5s infinite alternate; }
        @keyframes pulse-glow { from { transform: scale(1); } to { transform: scale(1.05); text-shadow: 0 0 20px rgba(0, 229, 255, 0.4); } }

        /* MÀN HÌNH CHÀO DEV */
        #dev-welcome {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: var(--color-dev); opacity: 0; visibility: hidden; transition: opacity 1s;
        }
        #dev-welcome h1 { font-size: 4rem; font-weight: 900; text-shadow: 0 0 30px var(--color-dev); letter-spacing: 5px;}
        #dev-welcome p { color: white; margin-top: 10px; font-size: 1.2rem; }

        /* === HEADER === */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; position: sticky; top: 0; z-index: 100; background: rgba(3, 3, 5, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); }
        .menu-btn { background: transparent; border: none; color: white; font-size: 1.5rem; transition: 0.3s; }
        .menu-btn:hover { color: var(--neon-accent); }
        .header-center h1 { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }

        /* === BỘ LỌC & DANH MỤC === */
        .filter-area { padding: 20px 24px 0; display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn { background: var(--glass-panel); border: 1px solid var(--glass-border); color: var(--text-sub); padding: 8px 20px; border-radius: 20px; font-weight: 600; white-space: nowrap; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-accent); border-color: var(--neon-accent); }

        /* === GRID LAYOUT & CARD === */
        .addon-container { padding: 20px 24px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
        .addon-card { background: var(--glass-panel); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; padding: 12px; position: relative; transition: 0.3s; }
        .addon-card:hover { border-color: rgba(0, 229, 255, 0.3); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-img-wrapper { position: relative; width: 100%; padding-top: 75%; border-radius: 14px; overflow: hidden; }
        .card-img-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-category { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; color: var(--neon-accent); }
        .card-content { padding: 12px 4px 4px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .card-author { font-size: 0.85rem; color: var(--text-sub); }
        
        /* Nút xóa dành cho DEV/ADMIN */
        .delete-post-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 0.9rem; cursor: pointer; display: none; }
        .delete-post-btn:hover { background: red; transform: scale(1.1); }

        /* === FLOATING DOCK === */
        .dock-container { position: fixed; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .dock { background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 8px; border-radius: 40px; display: flex; gap: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .dock-btn { background: transparent; border: none; color: var(--text-sub); padding: 12px 24px; border-radius: 30px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .dock-btn.active { color: white; background: rgba(255,255,255,0.05); }
        .dock-btn.upload { background: var(--text-main); color: var(--bg-base); font-weight: 800; margin-left: 10px; display: none; }
        .dock-btn.upload:hover { background: var(--neon-accent); box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); transform: scale(1.05); }

        /* === FULL SCREEN MENU & CHAT (3 GẠCH) === */
        .full-menu { position: fixed; inset: 0; background: rgba(5,5,8,0.98); backdrop-filter: blur(15px); z-index: 2000; display: flex; flex-direction: column; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .full-menu.open { transform: translateX(0); }
        
        .menu-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--glass-border); }
        .close-menu-btn { background: transparent; border: none; color: white; font-size: 2rem; }
        
        .menu-body { padding: 20px 24px; flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        /* Auth Area */
        .auth-area { display: flex; flex-direction: column; gap: 10px; background: var(--glass-panel); padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border); }
        .auth-btn { padding: 12px; border-radius: 12px; border: none; font-weight: 800; font-size: 1rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google { background: white; color: black; }
        .btn-guest { background: #333; color: white; }
        .btn-google:hover, .btn-guest:hover { transform: translateY(-2px); }
        .btn-logout { background: rgba(255,0,0,0.2); color: #ff4d4d; border: 1px solid rgba(255,0,0,0.5); display: none; }
        
        /* User Profile Info */
        .user-profile { display: none; align-items: center; gap: 15px; }
        .user-profile img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; }
        .badge.dev { background: var(--color-dev); color: white; }
        .badge.admin { background: var(--color-admin); color: black; }
        .badge.glx { background: var(--color-glx); color: black; }
        .badge.guest { background: var(--color-guest); color: white; }

        /* Chat Area */
        .chat-area { flex: 1; background: #0a0a0f; border-radius: 20px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .chat-header { padding: 15px; background: rgba(255,255,255,0.05); font-weight: 800; border-bottom: 1px solid var(--glass-border); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; font-size: 0.9rem; position: relative; }
        .msg-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.8rem; }
        
        /* Chat 3 dots cho DEV */
        .chat-options { background: transparent; border: none; color: var(--text-sub); cursor: pointer; display: none; }
        .chat-options:hover { color: white; }
        .grant-admin-btn { position: absolute; right: 10px; top: 30px; background: var(--color-admin); color: black; font-weight: bold; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.75rem; display: none; z-index: 10; }

        .chat-input-area { display: flex; padding: 10px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--glass-border); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        .chat-input-area button { background: var(--neon-accent); border: none; color: black; font-weight: 800; padding: 0 20px; border-radius: 10px; }
        
        .chat-overlay-lock { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--text-sub); backdrop-filter: blur(2px); z-index: 5; }

        /* === MODAL ĐĂNG BÀI === */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.4s; z-index: 1000; }
        .modal.show { opacity: 1; visibility: visible; }
        .modal-body { background: #0d0d12; width: 90%; max-width: 400px; padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border); transform: translateY(30px); transition: 0.4s; }
        .modal.show .modal-body { transform: translateY(0); }
        .modal-body h2 { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group select { width: 100%; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); color: white; outline: none; font-size: 0.95rem; }
        .modal-actions { display: flex; gap: 12px; margin-top: 25px; }
        .modal-actions button { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; border: none; }
        .btn-close { background: transparent; color: white; border: 1px solid var(--glass-border); }
        .btn-publish { background: var(--neon-accent); color: black; }
    </style>
</head>
<body>
    <div id="preloader"><div class="loader-text">MCPE.</div></div>
    <div class="ambient-glow"></div>

    <!-- Màn hình chào DEV -->
    <div id="dev-welcome">
        <h1>WELCOME DEV</h1>
        <p>Hệ thống đã cấp toàn quyền quản trị cho bạn.</p>
    </div>

    <!-- Header -->
    <header>
        <button class="menu-btn" onclick="toggleMenu(true)"><i class="fas fa-bars"></i></button>
        <div class="header-center"><h1>MCPE Addon</h1></div>
        <div class="header-right"><i class="fas fa-search" style="font-size: 1.2rem; color: var(--text-sub);"></i></div>
    </header>

    <!-- Bộ lọc danh mục -->
    <div class="filter-area">
        <button class="filter-btn active" onclick="filterPosts('all')">Tất cả</button>
        <button class="filter-btn" onclick="filterPosts('Addon')">Addon MC</button>
        <button class="filter-btn" onclick="filterPosts('Map')">Bản đồ</button>
        <button class="filter-btn" onclick="filterPosts('Shader')">Shader</button>
    </div>

    <!-- Grid Bài Viết -->
    <main class="addon-container" id="feed-container">
        <p style="text-align: center; color: var(--text-sub); width: 100%; grid-column: 1 / -1;">Đang tải dữ liệu...</p>
    </main>

    <!-- Dock dưới cùng -->
    <div class="dock-container">
        <div class="dock">
            <button class="dock-btn active"><i class="fas fa-compass"></i> Home</button>
            <button class="dock-btn upload" id="upload-btn" onclick="toggleUploadModal(true)"><i class="fas fa-plus"></i> Đăng bài</button>
        </div>
    </div>

    <!-- Menu Full Màn Hình (3 Gạch) -->
    <div class="full-menu" id="fullMenu">
        <div class="menu-header">
            <h2>Tài Khoản & Cộng Đồng</h2>
            <button class="close-menu-btn" onclick="toggleMenu(false)">&times;</button>
        </div>
        <div class="menu-body">
            
            <!-- Auth Area -->
            <div class="auth-area">
                <div class="user-profile" id="user-profile">
                    <img id="user-avatar" src="https://via.placeholder.com/50" alt="Avatar">
                    <div>
                        <h3 id="user-name">Tên User</h3>
                        <span class="badge" id="user-badge">ROLE</span>
                    </div>
                </div>

                <div id="login-buttons">
                    <button class="auth-btn btn-google" id="btn-google-login"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> Google</button>
                    <button class="auth-btn btn-guest" id="btn-guest-login"><i class="fas fa-user-secret"></i> Khách (Guest)</button>
                </div>
                <button class="auth-btn btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>

            <!-- Khung Chat -->
            <div class="chat-area">
                <div class="chat-header">Kênh Chat Chung</div>
                <div class="chat-messages" id="chat-messages">
                    <!-- Messses render here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button id="btn-send-chat"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div class="chat-overlay-lock" id="chat-lock">Vui lòng đăng nhập để chat</div>
            </div>
        </div>
    </div>

    <!-- Modal Đăng bài -->
    <div class="modal" id="postModal">
        <div class="modal-body">
            <h2>Đăng Addon / Shader</h2>
            <div class="input-group">
                <select id="postCategory">
                    <option value="Addon">Addon MC</option>
                    <option value="Map">Bản đồ (Map)</option>
                    <option value="Shader">Shader / Texture</option>
                </select>
            </div>
            <div class="input-group"><input type="text" id="titleInput" placeholder="Tên tác phẩm (Bắt buộc)"></div>
            <div class="input-group"><input type="text" id="imgInput" placeholder="Link ảnh (Tùy chọn)"></div>
            <div class="modal-actions">
                <button class="btn-close" onclick="toggleUploadModal(false)">Hủy</button>
                <button class="btn-publish" id="btn-publish-post">Đăng lên</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInAnonymously, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, remove, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 1. CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDImqkipwn1Rm7BUS0Su9fpd9gnKXcN7jw",
            authDomain: "addonshare-c1ffd.firebaseapp.com",
            databaseURL: "https://addonshare-c1ffd-default-rtdb.firebaseio.com",
            projectId: "addonshare-c1ffd",
            storageBucket: "addonshare-c1ffd.firebasestorage.app",
            messagingSenderId: "561066582050",
            appId: "1:561066582050:web:bacecfc6610a8516066a7b"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        const DEV_EMAIL = "hminhgalaxy@gmail.com";
        let currentUserInfo = null; // Chứa info + role
        let currentFilter = 'all';

        // Xử lý UI Menu
        window.toggleMenu = (show) => document.getElementById('fullMenu').classList.toggle('open', show);
        window.toggleUploadModal = (show) => document.getElementById('postModal').classList.toggle('show', show);
        
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('preloader').style.opacity = '0'; setTimeout(() => document.getElementById('preloader').style.display = 'none', 600); }, 1000);
        });

        // 2. LOGIC XÁC THỰC & PHÂN QUYỀN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Determine Role
                let role = 'guest';
                if (!user.isAnonymous) {
                    role = (user.email === DEV_EMAIL) ? 'dev' : 'glx';
                }

                // Kiểm tra database xem có bị DEV đổi thành admin không
                const roleSnapshot = await get(ref(db, `roles/${user.uid}`));
                if (roleSnapshot.exists()) {
                    const dbRole = roleSnapshot.val();
                    if(role !== 'dev') role = dbRole; // Dev tối cao không bị đè quyền
                } else {
                    // Lưu role mặc định lên DB
                    set(ref(db, `roles/${user.uid}`), role);
                }

                currentUserInfo = {
                    uid: user.uid,
                    name: user.isAnonymous ? `Khách_${user.uid.substring(0,4)}` : user.displayName,
                    avatar: user.isAnonymous ? "https://cdn-icons-png.flaticon.com/512/149/149071.png" : user.photoURL,
                    role: role
                };

                updateAuthUI(true);
                
                if (role === 'dev') {
                    showWelcomeDev();
                }

            } else {
                currentUserInfo = null;
                updateAuthUI(false);
            }
        });

        function updateAuthUI(isLoggedIn) {
            document.getElementById('login-buttons').style.display = isLoggedIn ? 'none' : 'flex';
            document.getElementById('user-profile').style.display = isLoggedIn ? 'flex' : 'none';
            document.getElementById('btn-logout').style.display = isLoggedIn ? 'block' : 'none';
            document.getElementById('chat-lock').style.display = isLoggedIn ? 'none' : 'flex';
            document.getElementById('upload-btn').style.display = isLoggedIn ? 'block' : 'none';

            if (isLoggedIn) {
                document.getElementById('user-avatar').src = currentUserInfo.avatar;
                document.getElementById('user-name').innerText = currentUserInfo.name;
                
                const badge = document.getElementById('user-badge');
                badge.className = `badge ${currentUserInfo.role}`;
                badge.innerText = currentUserInfo.role.toUpperCase();
            }
        }

        function showWelcomeDev() {
            const welcome = document.getElementById('dev-welcome');
            welcome.style.visibility = 'visible';
            welcome.style.opacity = '1';
            setTimeout(() => { welcome.style.opacity = '0'; setTimeout(() => welcome.style.visibility = 'hidden', 1000); }, 2500);
        }

        // Nút Đăng nhập / Đăng xuất
        document.getElementById('btn-google-login').onclick = () => signInWithPopup(auth, googleProvider).catch(e => alert("Lỗi: " + e.message));
        document.getElementById('btn-guest-login').onclick = () => signInAnonymously(auth).catch(e => alert("Lỗi: " + e.message)); // Firebase tự handle nhớ guest theo trình duyệt
        document.getElementById('btn-logout').onclick = () => { if(confirm("Đăng xuất?")) signOut(auth); };

        // 3. LOGIC BÀI VIẾT (ADDONS)
        const postsRef = ref(db, 'addons');
        onValue(postsRef, (snapshot) => {
            renderPosts(snapshot.val());
        });

        function renderPosts(data) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';
            if (!data) return container.innerHTML = '<p style="text-align:center;width:100%;">Chưa có bài viết.</p>';

            let posts = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
            
            // Lọc theo Category
            if (currentFilter !== 'all') {
                posts = posts.filter(p => p.category === currentFilter);
            }

            posts.forEach(post => {
                const isPrivileged = currentUserInfo && (currentUserInfo.role === 'dev' || currentUserInfo.role === 'admin');
                const deleteBtn = isPrivileged ? `<button class="delete-post-btn" onclick="deletePost('${post.id}')" style="display:block;"><i class="fas fa-trash"></i></button>` : '';

                const html = `
                    <article class="addon-card">
                        ${deleteBtn}
                        <div class="card-img-wrapper">
                            <span class="card-category">${post.category}</span>
                            <img src="${post.image}" alt="Img">
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${post.title}</h3>
                            <p class="card-author">Bởi: ${post.authorName}</p>
                        </div>
                    </article>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // DEV/ADMIN Xóa Bài
        window.deletePost = (id) => {
            if(confirm("Xóa bài viết này khỏi hệ thống?")) remove(ref(db, `addons/${id}`));
        }

        // Đăng bài mới
        document.getElementById('btn-publish-post').onclick = () => {
            const title = document.getElementById('titleInput').value.trim();
            const cat = document.getElementById('postCategory').value;
            let img = document.getElementById('imgInput').value.trim();
            
            if(!title) return alert("Cần nhập tên!");
            if(!img) img = "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?w=600";

            push(postsRef, {
                title: title, category: cat, image: img,
                authorName: currentUserInfo.name,
                authorUid: currentUserInfo.uid,
                timestamp: serverTimestamp()
            }).then(() => {
                toggleUploadModal(false);
                document.getElementById('titleInput').value = ''; document.getElementById('imgInput').value = '';
            });
        };

        // Lọc bài viết
        window.filterPosts = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            get(postsRef).then(snap => renderPosts(snap.val())); // Trigger render lại
        }


        // 4. LOGIC CHAT & CẤP QUYỀN
        const chatRef = ref(db, 'chat');
        const chatBox = document.getElementById('chat-messages');

        onValue(chatRef, (snapshot) => {
            chatBox.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const msg = data[key];
                    const isDev = currentUserInfo && currentUserInfo.role === 'dev';
                    // Nếu là DEV, hiện dấu 3 chấm để cấp quyền
                    const optionsBtn = isDev ? `<button class="chat-options" onclick="toggleAdminBtn('${key}')"><i class="fas fa-ellipsis-v"></i></button>` : '';
                    const adminBtn = isDev ? `<button id="grant-${key}" class="grant-admin-btn" onclick="grantAdmin('${msg.uid}')">Make Admin</button>` : '';

                    const html = `
                        <div class="chat-msg">
                            <div class="msg-header">
                                <span><span class="badge ${msg.role}">${msg.role.toUpperCase()}</span> <b>${msg.name}</b></span>
                                <div>${optionsBtn} ${adminBtn}</div>
                            </div>
                            <div class="msg-text">${msg.text}</div>
                        </div>
                    `;
                    chatBox.insertAdjacentHTML('beforeend', html);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        // Gửi tin nhắn
        document.getElementById('btn-send-chat').onclick = sendMsg;
        document.getElementById('chat-input').addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

        function sendMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !currentUserInfo) return;

            push(chatRef, {
                uid: currentUserInfo.uid,
                name: currentUserInfo.name,
                role: currentUserInfo.role,
                text: text,
                timestamp: serverTimestamp()
            });
            input.value = '';
        }

        // DEV Cấp quyền Admin
        window.toggleAdminBtn = (msgId) => {
            const btn = document.getElementById(`grant-${msgId}`);
            btn.style.display = btn.style.display === 'block' ? 'none' : 'block';
        }

        window.grantAdmin = (targetUid) => {
            if(confirm("Cấp quyền ADMIN cho người dùng này?")) {
                set(ref(db, `roles/${targetUid}`), 'admin').then(() => {
                    alert("Cấp quyền thành công! Người dùng sẽ nhận quyền ở lần tải sau.");
                });
            }
        }
    </script>
</body>
</html>
