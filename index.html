<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPE Addon - Về Bản Ngã</title>
    <!-- Thư viện icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #15162c;
            --card-bg: rgba(255, 255, 255, 0.08);
            --accent: #00c6ff;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --dev-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f101f, #1b1e3d, #15162c);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Nền sao tĩnh (Đã tối ưu để không bị lag) */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 160px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px;
            opacity: 0.2; z-index: -1;
        }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; position: sticky; top: 0;
            background: rgba(15, 16, 31, 0.9); backdrop-filter: blur(10px);
            z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .google-login {
            background: var(--card-bg); width: 42px; height: 42px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; overflow: hidden;
        }
        .google-login:hover { background: rgba(255,255,255,0.2); }
        .google-login i { color: #ea4335; font-size: 1.2rem; }
        .google-login img { width: 100%; height: 100%; object-fit: cover; }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }

        .clock {
            font-size: 0.9rem; font-weight: 500; background: var(--card-bg);
            padding: 5px 12px; border-radius: 12px;
        }

        /* --- SEARCH --- */
        .search-container { padding: 15px 20px; }
        .search-box {
            display: flex; align-items: center; background: var(--card-bg);
            border-radius: 12px; padding: 12px 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .search-box input {
            flex: 1; background: none; border: none; outline: none;
            color: white; margin: 0 10px; font-size: 0.95rem;
        }

        /* --- FEED BÀI VIẾT TỪ FIREBASE --- */
        .feed { padding: 10px 20px; display: flex; flex-direction: column; gap: 25px; }

        .card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            transition: 0.3s;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px;
        }
        .card-info { text-align: center; flex: 1; padding: 0 10px; }
        .card-info h3 { font-size: 1.1rem; margin-bottom: 3px; }
        .card-info p { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .card-stats { text-align: center; font-size: 0.9rem; min-width: 40px; }
        
        .card-image { width: 100%; height: 200px; object-fit: cover; border-top: 1px solid rgba(255,255,255,0.05); }

        .dev-badge {
            background: var(--dev-red); color: white; padding: 2px 6px;
            border-radius: 5px; font-size: 0.7rem; font-weight: bold;
        }

        /* --- BOTTOM NAV TỐI GIẢN --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 16, 31, 0.95); display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px); z-index: 99;
        }
        .nav-item { text-align: center; color: var(--text-sub); cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 1.4rem; }

        /* Nút đăng bài - Chỉ hiện khi đăng nhập */
        .nav-item.upload { display: none; color: white; }

        /* --- MODAL ĐĂNG BÀI --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s; z-index: 200;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: #1b1e3d; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-content h2 { margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; outline: none;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-submit { background: linear-gradient(45deg, #00c6ff, #0072ff); color: white; }
    </style>
</head>
<body>
    <div class="stars"></div>

    <header>
        <div class="google-login" id="login-btn" title="Đăng nhập Google">
            <i class="fab fa-google"></i>
        </div>
        <div class="logo">MCPE ADDON</div>
        <div class="clock" id="clock">00:00</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search text-sub"></i>
            <input type="text" placeholder="Tìm kiếm nội dung...">
        </div>
    </div>

    <div class="feed" id="feed">
        <p style="text-align: center; color: #b3b3b3;">Đang tải dữ liệu từ máy chủ...</p>
    </div>

    <!-- Menu Dưới Tối Giản -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item upload" id="open-modal-btn">
            <i class="fas fa-plus-circle" style="font-size: 1.8rem; color: #00c6ff;"></i>
        </div>
    </div>

    <!-- Popup Đăng Bài -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <h2>Chia Sẻ Mới</h2>
            <div class="input-group">
                <input type="text" id="postTitle" placeholder="Tên Addon / Map">
            </div>
            <div class="input-group">
                <input type="text" id="postImage" placeholder="Link ảnh minh họa">
            </div>
            <div class="modal-btns">
                <button class="btn btn-cancel" id="close-modal-btn">Hủy</button>
                <button class="btn btn-submit" id="submit-post-btn">Đăng bài</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDImqkipwn1Rm7BUS0Su9fpd9gnKXcN7jw",
            authDomain: "addonshare-c1ffd.firebaseapp.com",
            databaseURL: "https://addonshare-c1ffd-default-rtdb.firebaseio.com",
            projectId: "addonshare-c1ffd",
            storageBucket: "addonshare-c1ffd.firebasestorage.app",
            messagingSenderId: "561066582050",
            appId: "1:561066582050:web:bacecfc6610a8516066a7b",
            measurementId: "G-TFQXBNRNYJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        const loginBtn = document.getElementById('login-btn');
        const uploadBtn = document.getElementById('open-modal-btn');

        // 1. Quản lý Đăng Nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginBtn.innerHTML = `<img src="${user.photoURL}" alt="User">`;
                uploadBtn.style.display = 'block'; // Hiện nút Upload
            } else {
                currentUser = null;
                loginBtn.innerHTML = `<i class="fab fa-google"></i>`;
                uploadBtn.style.display = 'none'; // Ẩn nút Upload
            }
        });

        loginBtn.addEventListener('click', () => {
            if (currentUser) {
                if(confirm("Bạn muốn đăng xuất?")) signOut(auth);
            } else {
                signInWithPopup(auth, provider).catch(err => {
                    // Nếu gặp lỗi config, báo cho người dùng
                    alert("Lỗi: " + err.message + "\n\nVui lòng vào Firebase Console bật tính năng đăng nhập Google!");
                });
            }
        });

        // 2. Realtime Database (Tải feed bài viết)
        const feed = document.getElementById('feed');
        const postsRef = ref(db, 'addons');

        onValue(postsRef, (snapshot) => {
            feed.innerHTML = ''; 
            const data = snapshot.val();
            
            if (data) {
                // Đảo ngược để hiện bài mới nhất lên trên
                const posts = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                
                posts.forEach(post => {
                    // Tính năng Huy Hiệu DEV
                    let devBadge = '';
                    if (post.email === 'hminhgalaxy@gmail.com') {
                        devBadge = `<span class="dev-badge">DEV</span>`;
                    }

                    const cardHTML = `
                        <div class="card">
                            <div class="card-header">
                                <div class="card-stats"><i class="fas fa-star" style="color: gold;"></i><br>Mới</div>
                                <div class="card-info">
                                    <h3>${post.title}</h3>
                                    <p>Tạo bởi ${post.author} ${devBadge}</p>
                                </div>
                                <div class="card-stats"><i class="fas fa-fire" style="color: #ff4b2b;"></i><br>🔥</div>
                            </div>
                            <img class="card-image" src="${post.image}" alt="Img">
                        </div>
                    `;
                    feed.insertAdjacentHTML('beforeend', cardHTML);
                });
            } else {
                feed.innerHTML = '<p style="text-align: center; color: #b3b3b3;">Chưa có bài viết nào.</p>';
            }
        });

        // 3. Modal Đăng Bài
        const modal = document.getElementById('uploadModal');
        uploadBtn.addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

        document.getElementById('submit-post-btn').addEventListener('click', () => {
            const title = document.getElementById('postTitle').value.trim();
            let img = document.getElementById('postImage').value.trim();
            
            if (!title) return alert("Vui lòng điền tên Addon!");
            if (!img) img = "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1000"; // Ảnh mặc định

            push(postsRef, {
                title: title,
                image: img,
                author: currentUser.displayName,
                email: currentUser.email,
                createdAt: serverTimestamp()
            }).then(() => {
                modal.classList.remove('active');
                document.getElementById('postTitle').value = '';
                document.getElementById('postImage').value = '';
            }).catch(err => alert("Lỗi khi đăng: " + err.message));
        });

        // 4. Đồng hồ
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
        }, 1000);
    </script>
</body>
</html>
