<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-signin-client_id" content="829757105077-9pe97kktuhejoa51fcebugq0f1rae3le.apps.googleusercontent.com">
    <title>GALAXY CRAFT</title>
    
    <!-- Firebase SDK (Sử dụng bản v8 để dễ dàng tích hợp 1 file) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* CSS Reset & Variables */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --bg: #0f0f1b; --card-bg: #1a1a2e; --text: #e0e0e0; --accent: #4d4dff; --dev: #00ff88; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Intro Animation */
        #intro { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; animation: hideIntro 1s ease-in-out 2.5s forwards; }
        #intro h1 { font-size: 4rem; color: #fff; letter-spacing: 10px; animation: scaleUp 2s ease-out forwards; text-shadow: 0 0 20px var(--accent); }
        @keyframes scaleUp { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes hideIntro { 0% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; } }

        /* Navbar & Hamburger */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(26, 26, 46, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 2px; }
        .hamburger { font-size: 2rem; cursor: pointer; user-select: none; transition: 0.3s; }
        .hamburger:hover { color: var(--accent); }

        /* Sidebar Menu */
        #sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: #161625; transition: 0.4s ease-in-out; padding: 80px 20px 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 99; }
        #sidebar.open { right: 0; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 2rem; cursor: pointer; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; }
        .btn-google { background: #fff; color: #333; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-google:hover { background: #ddd; }
        .btn-logout { background: #ff4d4d; color: #fff; display: none; }
        .user-info { text-align: center; margin-bottom: 20px; display: none; }
        .user-info img { width: 60px; border-radius: 50%; margin-bottom: 10px; }

        /* Toast Notification */
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--dev); color: #000; padding: 15px 30px; border-radius: 8px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,255,136,0.4); transition: 0.5s ease-in-out; z-index: 1000; }
        #toast.show { top: 30px; }

        /* Main Content */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* Admin Panel */
        #admin-panel { background: var(--card-bg); padding: 25px; border-radius: 10px; margin-bottom: 40px; display: none; border: 1px solid var(--dev); }
        #admin-panel h2 { color: var(--dev); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0f0f1b; border: 1px solid #333; color: #fff; border-radius: 5px; }
        .btn-add { background: var(--dev); color: #000; }

        /* Grid Items */
        #content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; transition: transform 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-title { font-size: 1.2rem; margin-bottom: 10px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #bbb; margin-bottom: 15px; line-height: 1.5; }
        .card-link { display: inline-block; color: var(--accent); text-decoration: none; font-weight: bold; }
        .card-actions { padding: 10px 20px; background: rgba(0,0,0,0.2); display: none; justify-content: space-between; }
        .btn-sm { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
        .btn-edit { background: #ffa500; color: #fff; }
        .btn-delete { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <!-- Intro Animation -->
    <div id="intro">
        <h1>GALAXY CRAFT</h1>
    </div>

    <!-- Dev Toast -->
    <div id="toast">XIN CHÀO DEVERLOPER</div>

    <!-- Header & Nav -->
    <header>
        <div class="logo">GALAXY CRAFT</div>
        <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
    </header>

    <!-- Sidebar Menu -->
    <div id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">&times;</div>
        
        <div class="user-info" id="user-info">
            <img id="user-avatar" src="" alt="Avatar">
            <h3 id="user-name"></h3>
            <p id="user-email" style="font-size: 0.8rem; color: #aaa;"></p>
        </div>

        <button class="btn btn-google" id="btn-login" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 20px;"> 
            Đăng nhập Google
        </button>
        <button class="btn btn-logout" id="btn-logout" onclick="logout()">Đăng xuất</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Admin Panel (Chỉ hiện cho DEV) -->
        <div id="admin-panel">
            <h2><span style="font-size:1.5rem">&#9881;</span> Bảng điều khiển Developer</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <input type="text" id="item-title" placeholder="Tiêu đề...">
            </div>
            <div class="form-group">
                <input type="text" id="item-img" placeholder="Link hình ảnh (URL)...">
            </div>
            <div class="form-group">
                <input type="text" id="item-link" placeholder="Link điều hướng (URL)...">
            </div>
            <div class="form-group">
                <textarea id="item-desc" rows="3" placeholder="Mô tả..."></textarea>
            </div>
            <button class="btn btn-add" onclick="saveItem()">Lưu Dữ Liệu</button>
        </div>

        <!-- Nơi hiển thị dữ liệu web -->
        <div id="content-grid">
            <!-- Items sẽ được render ở đây bởi Javascript -->
        </div>

    </div>

    <script>
        // 1. Khởi tạo Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDBlMGmdcdxzJQ-dYBzw2zzfRTu2vh6GG0",
            authDomain: "goggle-login-39224.firebaseapp.com",
            databaseURL: "https://goggle-login-39224-default-rtdb.firebaseio.com",
            projectId: "goggle-login-39224",
            storageBucket: "goggle-login-39224.firebasestorage.app",
            messagingSenderId: "479026449758",
            appId: "1:479026449758:web:661543f85ebeb7621393cf",
            measurementId: "G-11EF7RQKS3"
        };
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();
        const DEV_EMAIL = "hminhgalaxy@gmail.com";
        let isDev = false;

        // 2. Xử lý UI Menu & Toast
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showDevToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000); // Tự động biến mất sau 4 giây
        }

        // 3. Xử lý Đăng nhập / Đăng xuất
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                alert("Lỗi đăng nhập: " + error.message);
            });
        }

        function logout() {
            auth.signOut().then(() => {
                toggleMenu(); // Đóng menu khi đăng xuất
            });
        }

        // 4. Theo dõi trạng thái đăng nhập
        auth.onAuthStateChanged(user => {
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const userInfo = document.getElementById('user-info');
            const adminPanel = document.getElementById('admin-panel');

            if (user) {
                // UI cho người đã đăng nhập
                btnLogin.style.display = 'none';
                btnLogout.style.display = 'block';
                userInfo.style.display = 'block';
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').src = user.photoURL;

                // Kiểm tra xem có phải DEV không
                if (user.email === DEV_EMAIL) {
                    if (!isDev) { // Chỉ show toast lần đầu khi vừa đăng nhập vào
                        showDevToast();
                    }
                    isDev = true;
                    adminPanel.style.display = 'block';
                } else {
                    isDev = false;
                    adminPanel.style.display = 'none';
                }
            } else {
                // UI cho người chưa đăng nhập
                btnLogin.style.display = 'flex';
                btnLogout.style.display = 'none';
                userInfo.style.display = 'none';
                adminPanel.style.display = 'none';
                isDev = false;
            }
            renderItems(); // Render lại danh sách để hiện/ẩn nút Sửa-Xóa
        });

        // 5. Thao tác với Database (CRUD)
        let webData = [];

        // Lắng nghe dữ liệu realtime
        db.ref('webContent').on('value', snapshot => {
            webData = [];
            snapshot.forEach(child => {
                webData.push({ id: child.key, ...child.val() });
            });
            renderItems();
        });

        // Hàm render dữ liệu ra grid
        function renderItems() {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = ''; // Clear cũ
            
            if (webData.length === 0) {
                grid.innerHTML = '<p style="color:#aaa;">Chưa có dữ liệu. Vui lòng thêm mục mới (Cần đăng nhập Dev).</p>';
                return;
            }

            webData.forEach(item => {
                const adminActions = isDev ? `
                    <div class="card-actions" style="display:flex;">
                        <button class="btn-sm btn-edit" onclick="editItem('${item.id}')">Sửa</button>
                        <button class="btn-sm btn-delete" onclick="deleteItem('${item.id}')">Xóa</button>
                    </div>
                ` : '';

                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.img || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${item.title}">
                        <div class="card-body">
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.desc}</p>
                            ${item.link ? `<a href="${item.link}" target="_blank" class="card-link">Xem chi tiết &rarr;</a>` : ''}
                        </div>
                        ${adminActions}
                    </div>
                `;
            });
        }

        // Thêm / Cập nhật dữ liệu
        function saveItem() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('item-title').value;
            const img = document.getElementById('item-img').value;
            const link = document.getElementById('item-link').value;
            const desc = document.getElementById('item-desc').value;

            if (!title) { alert('Vui lòng nhập tiêu đề!'); return; }

            const itemData = { title, img, link, desc, timestamp: Date.now() };

            if (id) {
                // Update
                db.ref('webContent/' + id).update(itemData).then(() => {
                    clearForm();
                });
            } else {
                // Add new
                db.ref('webContent').push(itemData).then(() => {
                    clearForm();
                });
            }
        }

        // Đổ dữ liệu lên form để sửa
        function editItem(id) {
            const item = webData.find(x => x.id === id);
            if (item) {
                document.getElementById('edit-id').value = id;
                document.getElementById('item-title').value = item.title || '';
                document.getElementById('item-img').value = item.img || '';
                document.getElementById('item-link').value = item.link || '';
                document.getElementById('item-desc').value = item.desc || '';
                
                // Cuộn lên chỗ admin panel
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Xóa dữ liệu
        function deleteItem(id) {
            if (confirm("Bạn có chắc chắn muốn xóa mục này không?")) {
                db.ref('webContent/' + id).remove();
            }
        }

        // Xóa form sau khi thao tác
        function clearForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('item-title').value = '';
            document.getElementById('item-img').value = '';
            document.getElementById('item-link').value = '';
            document.getElementById('item-desc').value = '';
        }
    </script>
</body>
</html>
