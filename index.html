<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Craft - Chia Sẻ Minecraft Addons & Modpacks</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; }
    .btn { background: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .btn-danger { background: #f44336; }
    
    /* Badge DEV đặc biệt */
    .dev-badge {
      background: linear-gradient(45deg, #FFD700, #FF007F);
      color: #000;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8em;
      margin-left: 8px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .admin-panel { display: none; background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #FFD700; }
    .search-box { margin: 20px 0; width: 100%; padding: 10px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; position: relative; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Galaxy Craft</h1>
    <div id="auth-section">
      <button id="login-btn" class="btn">Đăng nhập Google</button>
      <div id="user-info" style="display:none;">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn btn-danger" style="margin-left:10px;">Đăng xuất</button>
      </div>
    </div>
  </header>

  <!-- Tìm kiếm thông minh -->
  <input type="text" id="search-input" class="search-box" placeholder="🔍 Tìm kiếm Modpack, Addon, Resource Pack...">

  <!-- Bảng điều khiển DEV (Chỉ hiển thị với hminhgalaxy@gmail.com) -->
  <div id="dev-panel" class="admin-panel">
    <h3 style="color: #FFD700;">🛠️ Bảng Điều Khiển DEV</h3>
    <input type="text" id="post-title" placeholder="Tên Pack / Addon" style="width: 100%; margin-bottom: 10px; padding: 8px;">
    <textarea id="post-desc" placeholder="Mô tả chi tiết" style="width: 100%; margin-bottom: 10px; padding: 8px;"></textarea>
    <button id="add-post-btn" class="btn">Thêm Bài Viết Mới</button>
  </div>

  <h2>Danh Sách Resource & Modpacks</h2>
  <div id="posts-container" class="grid"></div>

  <!-- Firebase JavaScript SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDBlMGmdcdxzJQ-dYBzw2zzfRTu2vh6GG0",
      authDomain: "goggle-login-39224.firebaseapp.com",
      databaseURL: "https://goggle-login-39224-default-rtdb.firebaseio.com",
      projectId: "goggle-login-39224",
      storageBucket: "goggle-login-39224.firebasestorage.app",
      messagingSenderId: "479026449758",
      appId: "1:479026449758:web:661543f85ebeb7621393cf",
      measurementId: "G-11EF7RQKS3"
    };

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const DEV_EMAIL = "hminhgalaxy@gmail.com";
    let currentUser = null;

    // Đăng nhập bằng Google
    document.getElementById('login-btn').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => console.error(error));
    });

    // Đăng xuất
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth);
    });

    // Theo dõi trạng thái Đăng nhập
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        
        let nameHTML = user.displayName;
        
        // Kiểm tra quyền DEV
        if (user.email === DEV_EMAIL) {
          nameHTML += `<span class="dev-badge">DEV</span>`;
          document.getElementById('dev-panel').style.display = 'block';
        } else {
          document.getElementById('dev-panel').style.display = 'none';
        }
        
        document.getElementById('user-name').innerHTML = nameHTML;
      } else {
        currentUser = null;
        document.getElementById('login-btn').style.display = 'block';
        document.getElementById('user-info').style.display = 'none';
        document.getElementById('dev-panel').style.display = 'none';
      }
      loadPosts();
    });

    // Thêm bài viết mới (Chỉ dành cho DEV)
    document.getElementById('add-post-btn').addEventListener('click', () => {
      if (!currentUser || currentUser.email !== DEV_EMAIL) return;

      const title = document.getElementById('post-title').value;
      const desc = document.getElementById('post-desc').value;

      if (title && desc) {
        const postsRef = ref(db, 'posts');
        const newPostRef = push(postsRef);
        set(newPostRef, {
          title: title,
          description: desc,
          createdAt: Date.now()
        }).then(() => {
          document.getElementById('post-title').value = '';
          document.getElementById('post-desc').value = '';
        });
      }
    });

    // Tải và hiển thị bài viết + Chức năng Tìm kiếm
    function loadPosts() {
      const postsRef = ref(db, 'posts');
      onValue(postsRef, (snapshot) => {
        const data = snapshot.val();
        renderPosts(data);
      });
    }

    function renderPosts(data) {
      const container = document.getElementById('posts-container');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      if (!data) return;

      Object.keys(data).forEach(key => {
        const post = data[key];
        if (post.title.toLowerCase().includes(searchTerm) || post.description.toLowerCase().includes(searchTerm)) {
          const card = document.createElement('div');
          card.className = 'card';
          
          let deleteBtn = '';
          if (currentUser && currentUser.email === DEV_EMAIL) {
            deleteBtn = `<button class="btn btn-danger" onclick="deletePost('${key}')" style="position:absolute; top:10px; right:10px; padding:2px 8px;">Xóa</button>`;
          }

          card.innerHTML = `
            ${deleteBtn}
            <h3>${post.title}</h3>
            <p>${post.description}</p>
          `;
          container.appendChild(card);
        }
      });
    }

    // Xóa bài viết
    window.deletePost = function(id) {
      if (currentUser && currentUser.email === DEV_EMAIL) {
        remove(ref(db, `posts/${id}`));
      }
    };

    // Tìm kiếm thời gian thực
    document.getElementById('search-input').addEventListener('input', () => {
      loadPosts();
    });
  </script>
</body>
</html>
