<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galaxy Craft - Nền tảng chia sẻ Mod, Addon, Texture Pack Minecraft cao cấp." />
    <title>Galaxy Craft | Premium Minecraft Hub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M12 2L2 7L12 12L22 7L12 2Z' fill='%2322C55E'/><path d='M2 17L12 22L22 17' stroke='%2322C55E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#050505', surface: '#121214', card: '#18181B', border: 'rgba(255,255,255,0.08)',
                        accent: '#10B981', 'accent-hover': '#059669',
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
                    boxShadow: { 
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                        'glow': '0 0 20px rgba(16, 185, 129, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #050505; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.04), transparent 25%);
            background-attachment: fixed;
            margin: 0; padding: 0;
            color: #E4E4E7;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #10B981; }
        
        /* Modern Glassmorphism */
        .glass-panel { 
            background: rgba(24, 24, 27, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .gradient-text { 
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text; color: transparent; 
        }

        /* Animations */
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Modern Inputs */
        .modern-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s ease;
        }
        .modern-input:focus {
            background: rgba(255,255,255,0.05);
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }

        /* Premium Card */
        .premium-card {
            background: linear-gradient(180deg, rgba(30,30,34,0.4) 0%, rgba(20,20,23,0.8) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .premium-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5), 0 0 15px rgba(16, 185, 129, 0.08);
        }

        /* Loading Spinner */
        .spinner { border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased">
    
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>
    <div id="secret-container" class="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDBlMGmdcdxzJQ-dYBzw2zzfRTu2vh6GG0",
            authDomain: "goggle-login-39224.firebaseapp.com",
            databaseURL: "https://goggle-login-39224-default-rtdb.firebaseio.com",
            projectId: "goggle-login-39224",
            storageBucket: "goggle-login-39224.firebasestorage.app",
            messagingSenderId: "479026449758",
            appId: "1:479026449758:web:661543f85ebeb7621393cf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getDatabase(app);

        let currentUser = null;
        let isDev = false;
        let isDevMenuOpen = false;
        let allPacks = [];
        let currentSearchTerm = "";
        let currentCategory = "All";

        let redDotClicks = 0;
        let devCodeInput = "";
        const targetDevCode = "YYGGG";

        // ==========================================
        // TOAST NOTIFICATIONS (Mới)
        // ==========================================
        window.showToast = (type, title, message) => {
            const container = document.getElementById('toast-container');
            const icons = { success: 'check-circle-2', error: 'alert-triangle', info: 'info' };
            const colors = { success: 'text-emerald-400 border-emerald-500/20 bg-emerald-500/10', error: 'text-rose-400 border-rose-500/20 bg-rose-500/10', info: 'text-blue-400 border-blue-500/20 bg-blue-500/10' };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto p-4 rounded-xl border backdrop-blur-md shadow-lg flex items-start gap-3 animate-fade-up min-w-[300px] ${colors[type]}`;
            toast.innerHTML = `
                <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                <div class="flex-1">
                    <h4 class="font-semibold text-white text-sm">${title}</h4>
                    ${message ? `<p class="text-white/70 text-xs mt-1 leading-relaxed">${message}</p>` : ''}
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px)'; toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        // ==========================================
        // AUTH LOGIC
        // ==========================================
        window.handleLogin = () => signInWithPopup(auth, provider).catch(err => showToast('error', 'Lỗi đăng nhập', err.message));

        window.handleLogout = () => {
            if (currentUser && !currentUser.googleUid) { // Thoát tài khoản bí mật
                currentUser = null; isDev = false; isDevMenuOpen = false;
                renderApp(); showToast('info', 'Đã đăng xuất', 'Đã thoát chế độ DEV.');
            } else {
                signOut(auth).then(() => {
                    currentUser = null; isDev = false; isDevMenuOpen = false;
                    renderApp(); showToast('info', 'Đã đăng xuất', 'Hẹn gặp lại!');
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user && !isDev) {
                currentUser = user; currentUser.googleUid = user.uid;
                if (user.email === "hminhgalaxy@gmail.com") {
                    isDev = true; showToast('success', 'Xác thực thành công', 'Chào mừng Developer!');
                } else { isDev = false; }
                renderApp();
            }
        });

        // Tải Data
        onValue(ref(db, 'galaxy_craft_packs'), (snapshot) => {
            const data = snapshot.val();
            allPacks = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
            renderPackGrid();
        });

        // ==========================================
        // SECRET DEV LOGIN (Giao diện chuẩn Cyber/Admin)
        // ==========================================
        const renderSecretContainer = () => {
            document.getElementById('secret-container').innerHTML = `<div onclick="clickRedDot()" class="w-2 h-2 bg-rose-500/20 hover:bg-rose-500 rounded-full cursor-pointer transition-all duration-300"></div>`;
        };

        window.clickRedDot = () => { redDotClicks++; if (redDotClicks >= 5) renderSecretPad(); };
        window.resetSecret = () => { redDotClicks = 0; devCodeInput = ""; renderSecretContainer(); };

        const renderSecretPad = () => {
            document.getElementById('secret-container').innerHTML = `
                <div class="glass-panel p-4 rounded-xl shadow-lg flex flex-col items-center gap-3 animate-scale-in border-white/10">
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Security Pin</p>
                    <div class="flex gap-3">
                        <button onclick="clickDevColor('Y')" class="w-10 h-10 rounded bg-amber-500/80 hover:bg-amber-400 transition-colors"></button>
                        <button onclick="clickDevColor('G')" class="w-10 h-10 rounded bg-emerald-500/80 hover:bg-emerald-400 transition-colors"></button>
                    </div>
                    <div class="flex gap-1.5 mt-2">
                        <div id="dot-0" class="w-1.5 h-1.5 bg-white/20 rounded-full"></div><div id="dot-1" class="w-1.5 h-1.5 bg-white/20 rounded-full"></div><div id="dot-2" class="w-1.5 h-1.5 bg-white/20 rounded-full"></div><div id="dot-3" class="w-1.5 h-1.5 bg-white/20 rounded-full"></div><div id="dot-4" class="w-1.5 h-1.5 bg-white/20 rounded-full"></div>
                    </div>
                    <button onclick="resetSecret()" class="text-[10px] text-white/40 hover:text-white mt-1">Cancel</button>
                </div>`;
        };

        window.clickDevColor = (color) => {
            devCodeInput += color;
            const dot = document.getElementById(`dot-${devCodeInput.length - 1}`);
            if (dot) dot.className = `w-1.5 h-1.5 rounded-full shadow-[0_0_8px_currentColor] ${color === 'Y' ? 'bg-amber-400 text-amber-400' : 'bg-emerald-400 text-emerald-400'}`;
            
            if (devCodeInput.length === 5) {
                if (devCodeInput === targetDevCode) openSecretDevLogin();
                else { showToast('error', 'Access Denied', 'Sai trình tự bảo mật.'); resetSecret(); }
            }
        };

        const openSecretDevLogin = () => {
            document.getElementById('secret-container').innerHTML = '';
            document.getElementById('modal-root').innerHTML = `
                <div class="fixed inset-0 z-[110] flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeDevModal()"></div>
                    <div class="relative bg-[#0A0A0C] border border-white/10 rounded-2xl shadow-2xl w-full max-w-md p-8 animate-scale-in overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>
                        
                        <div class="text-center mb-8">
                            <div class="w-12 h-12 mx-auto rounded-full bg-emerald-500/10 flex items-center justify-center mb-4">
                                <i data-lucide="shield-alert" class="w-6 h-6 text-emerald-400"></i>
                            </div>
                            <h3 class="text-xl font-bold text-white tracking-tight">SYSTEM ADMIN</h3>
                            <p class="text-xs text-white/40 mt-1 uppercase tracking-widest">Restricted Area</p>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <input id="dev-email" type="email" class="w-full h-11 modern-input rounded-lg px-4 text-sm text-white" placeholder="Admin ID / Email">
                            </div>
                            <div>
                                <input id="dev-pass" type="password" class="w-full h-11 modern-input rounded-lg px-4 text-sm text-white" placeholder="Passcode">
                            </div>
                        </div>
                        
                        <button onclick="handleSecretDevLogin()" class="w-full mt-6 bg-emerald-500 hover:bg-emerald-600 text-white font-bold h-11 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                            <i data-lucide="unlock" class="w-4 h-4"></i> AUTHENTICATE
                        </button>
                        <button onclick="closeDevModal()" class="w-full mt-3 text-white/40 hover:text-white text-xs py-2 transition-colors">Abort</button>
                    </div>
                </div>`;
            lucide.createIcons();
        };

        window.handleSecretDevLogin = () => {
            const email = document.getElementById('dev-email').value;
            const pass = document.getElementById('dev-pass').value;
            const devAccounts = [
                { email: "hminhgalaxycraft@gmail.com", pass: "hoangminhbf2011", name: "Hoàng Minh" },
                { email: "tquangalaxycraft@gmail.com", pass: "tquangalaxy2011", name: "TQuan" }
            ];
            const validDev = devAccounts.find(acc => acc.email === email && acc.pass === pass);

            if (validDev) {
                currentUser = { displayName: validDev.name, email: validDev.email, photoURL: `https://ui-avatars.com/api/?name=${validDev.name}&background=10B981&color=fff&bold=true` };
                isDev = true;
                showToast('success', 'AUTHORIZED', `Welcome back, Admin ${validDev.name}.`);
                closeDevModal(); renderApp();
            } else { 
                showToast('error', 'AUTH FAILED', 'Thông tin không chính xác.'); 
            }
        };

        // ==========================================
        // CRUD TỐI ƯU GIAO DIỆN & FIX LỖI
        // ==========================================
        window.closeDevModal = () => { document.getElementById('modal-root').innerHTML = ''; resetSecret(); };
        window.openAddModal = () => { isDevMenuOpen = false; renderDevModal(null); };
        window.openEditModal = (id) => { const pack = allPacks.find(p => p.id === id); if (pack) renderDevModal(pack); };
        window.toggleDevMenu = () => { isDevMenuOpen = !isDevMenuOpen; renderApp(); };

        window.updateImagePreview = (url) => {
            const img = document.getElementById('image-preview');
            const placeholder = document.getElementById('image-placeholder');
            if (url) { img.src = url; img.classList.remove('hidden'); placeholder.classList.add('hidden'); } 
            else { img.classList.add('hidden'); placeholder.classList.remove('hidden'); }
        };

        window.handleFileSelect = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 600; let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/webp', 0.8); // Dùng webp cho nhẹ
                    document.getElementById('pack-img-input').value = dataUrl;
                    window.updateImagePreview(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // FIX LỖI LƯU PACK
        window.savePack = async (id) => {
            const btn = document.getElementById('save-pack-btn');
            try {
                const title = document.getElementById('pack-title').value.trim();
                const description = document.getElementById('pack-desc').value.trim();
                const category = document.getElementById('pack-cat').value;
                const imageUrl = document.getElementById('pack-img-input').value.trim();
                const downloadUrl = document.getElementById('pack-link').value.trim();

                if (!title || !downloadUrl) { 
                    showToast('error', 'Lỗi nhập liệu', 'Vui lòng điền Tên Pack và Link tải!'); 
                    return; 
                }

                btn.disabled = true;
                btn.innerHTML = '<div class="spinner"></div> <span class="ml-2">Đang lưu...</span>';
                btn.classList.add('opacity-70', 'cursor-not-allowed');

                const authorName = currentUser?.displayName || 'Admin';
                const packData = { title, description, category, imageUrl, downloadUrl, updatedAt: Date.now() };

                // Gửi lên Firebase
                if (id) {
                    await update(ref(db, `galaxy_craft_packs/${id}`), packData);
                    showToast('success', 'Thành công', 'Đã cập nhật Pack!');
                } else {
                    const newPackRef = push(ref(db, 'galaxy_craft_packs'));
                    await set(newPackRef, { ...packData, createdAt: Date.now(), author: authorName });
                    showToast('success', 'Thành công', 'Đã đăng Pack mới!');
                }
                closeDevModal();
            } catch (err) {
                console.error(err);
                // Nếu báo permission denied, nhắc người dùng về Rules Firebase
                const errorMsg = err.message.includes("Permission denied") 
                    ? "Lỗi quyền (Rules): Hãy mở quyền .write = true trong Firebase Realtime Database!" 
                    : err.message;
                showToast('error', 'Không thể lưu data', errorMsg);
            } finally {
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Lưu Thay Đổi';
                    btn.classList.remove('opacity-70', 'cursor-not-allowed');
                    lucide.createIcons();
                }
            }
        };

        window.deletePack = async (id) => {
            if (!confirm("Bạn có chắc chắn muốn xóa pack này vĩnh viễn?")) return;
            try {
                await remove(ref(db, `galaxy_craft_packs/${id}`));
                showToast('info', 'Đã xóa', 'Pack đã được gỡ khỏi hệ thống.');
            } catch(err) {
                showToast('error', 'Lỗi khi xóa', err.message);
            }
        };

        // Giao diện Modal Thêm/Sửa Tối Ưu Mới (2 Cột trên màn hình to)
        const renderDevModal = (pack) => {
            const isEdit = !!pack;
            
            document.getElementById('modal-root').innerHTML = `
                <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
                    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeDevModal()"></div>
                    
                    <div class="relative bg-card border border-border rounded-2xl shadow-2xl w-full max-w-4xl max-h-[95vh] flex flex-col animate-scale-in overflow-hidden">
                        
                        <!-- Header -->
                        <div class="px-6 py-4 border-b border-white/5 flex items-center justify-between bg-white/[0.02]">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                                    <i data-lucide="${isEdit ? 'edit-2' : 'plus'}" class="w-4 h-4"></i>
                                </div>
                                <h3 class="text-lg font-semibold text-white">${isEdit ? 'Chỉnh Sửa Nội Dung' : 'Thêm Nội Dung Mới'}</h3>
                            </div>
                            <button onclick="closeDevModal()" class="text-white/40 hover:text-white p-2 hover:bg-white/5 rounded-lg transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>

                        <!-- Body (2 Columns on Desktop) -->
                        <div class="p-6 overflow-y-auto flex-1 grid grid-cols-1 lg:grid-cols-5 gap-8 custom-scrollbar">
                            
                            <!-- Cột Trái: Ảnh -->
                            <div class="lg:col-span-2 space-y-4">
                                <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider">Thumbnail Cover</label>
                                <div onclick="document.getElementById('pack-file-input').click()" class="relative w-full aspect-video bg-white/[0.02] border-2 border-dashed border-white/10 hover:border-emerald-500/50 rounded-xl flex flex-col items-center justify-center cursor-pointer transition-colors group overflow-hidden">
                                    <img id="image-preview" src="${pack?.imageUrl || ''}" class="w-full h-full object-cover absolute inset-0 ${pack?.imageUrl ? '' : 'hidden'}" referrerpolicy="no-referrer">
                                    <div id="image-placeholder" class="${pack?.imageUrl ? 'hidden' : 'flex'} flex-col items-center text-white/40 group-hover:text-emerald-400 z-10 transition-colors">
                                        <i data-lucide="image-plus" class="w-8 h-8 mb-2"></i>
                                        <span class="text-sm font-medium">Click để tải ảnh lên</span>
                                    </div>
                                </div>
                                <div class="text-center text-xs text-white/40">Hoặc sử dụng URL ảnh trực tiếp:</div>
                                <input id="pack-img-input" oninput="updateImagePreview(this.value)" type="text" value="${pack?.imageUrl && !pack.imageUrl.startsWith('data:') ? pack.imageUrl : ''}" class="w-full h-10 modern-input rounded-lg px-4 text-xs text-white" placeholder="https://domain.com/image.png">
                                <input type="file" id="pack-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                            </div>

                            <!-- Cột Phải: Thông tin -->
                            <div class="lg:col-span-3 space-y-5">
                                <div>
                                    <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Tên Pack <span class="text-rose-500">*</span></label>
                                    <input id="pack-title" type="text" value="${pack?.title || ''}" class="w-full h-11 modern-input rounded-lg px-4 text-sm text-white font-medium" placeholder="Ví dụ: Ultra Realism Shader">
                                </div>
                                
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Thể Loại</label>
                                        <select id="pack-cat" class="w-full h-11 modern-input rounded-lg px-4 text-sm text-white appearance-none cursor-pointer">
                                            ${["Mod", "Addon", "Texture", "Shader"].map(c => `<option value="${c}" ${pack?.category === c ? 'selected' : ''} class="bg-card">${c}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Link Tải <span class="text-rose-500">*</span></label>
                                        <input id="pack-link" type="text" value="${pack?.downloadUrl || ''}" class="w-full h-11 modern-input rounded-lg px-4 text-sm text-white" placeholder="Mediafire, Drive, Linkvertise...">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-2">Mô Tả Chi Tiết</label>
                                    <textarea id="pack-desc" rows="4" class="w-full modern-input rounded-lg px-4 py-3 text-sm text-white resize-none" placeholder="Giới thiệu về nội dung, tính năng nổi bật...">${pack?.description || ''}</textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="px-6 py-4 border-t border-white/5 bg-white/[0.01] flex justify-end gap-3">
                            <button onclick="closeDevModal()" class="px-5 py-2.5 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 transition-colors">Hủy bỏ</button>
                            <button id="save-pack-btn" onclick="savePack('${pack?.id || ''}')" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                                <i data-lucide="save" class="w-4 h-4"></i> Lưu Thay Đổi
                            </button>
                        </div>

                    </div>
                </div>`;
            lucide.createIcons();
        };

        // ==========================================
        // UI CHÍNH (Header, Hero, Grid)
        // ==========================================
        window.handleSearchInput = (val) => {
            currentSearchTerm = val.toLowerCase(); 
            renderPackGrid();
        };

        window.handleCategoryFilter = (cat, event) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
                btn.classList.add('text-white/50', 'border-transparent', 'hover:bg-white/5');
            });
            event.currentTarget.classList.remove('text-white/50', 'border-transparent', 'hover:bg-white/5');
            event.currentTarget.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            renderPackGrid();
        };

        const renderPackGrid = () => {
            const gridContainer = document.getElementById('pack-grid');
            if (!gridContainer) return;

            let filteredPacks = allPacks.filter(p => {
                const matchCat = currentCategory === "All" || p.category === currentCategory;
                const matchSearch = !currentSearchTerm || p.title.toLowerCase().includes(currentSearchTerm) || (p.description && p.description.toLowerCase().includes(currentSearchTerm));
                return matchCat && matchSearch;
            });

            if (filteredPacks.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center border border-dashed border-white/10 rounded-2xl bg-white/[0.02]">
                        <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-4 text-white/20"><i data-lucide="package-open" class="w-8 h-8"></i></div>
                        <h3 class="text-lg font-semibold text-white/80">Chưa có nội dung nào</h3>
                        <p class="text-sm text-white/40 mt-1">Vui lòng thử danh mục khác hoặc tìm kiếm lại.</p>
                    </div>`;
                lucide.createIcons(); return;
            }

            gridContainer.innerHTML = filteredPacks.map((p, i) => `
                <div class="premium-card rounded-xl overflow-hidden flex flex-col h-full animate-fade-up" style="animation-delay: ${i * 0.05}s; opacity: 0;">
                    <div class="h-44 bg-surface relative overflow-hidden group">
                        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" referrerpolicy="no-referrer">` : `<div class="w-full h-full flex items-center justify-center bg-white/5 text-white/20"><i data-lucide="image" class="w-8 h-8"></i></div>`}
                        <div class="absolute inset-0 bg-gradient-to-t from-card via-transparent to-transparent opacity-90"></div>
                        <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/10 text-xs px-2.5 py-1 rounded-md text-emerald-400 font-medium flex items-center gap-1.5 shadow-lg"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span> ${p.category || 'Mod'}</div>
                    </div>
                    
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="text-base font-bold text-white mb-1.5 line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.title}</h3>
                        <p class="text-sm text-white/50 line-clamp-2 mb-4 flex-1 leading-relaxed">${p.description || 'Chưa có mô tả chi tiết.'}</p>
                        
                        <div class="flex items-center gap-2 mt-auto pt-4 border-t border-white/5">
                            <a href="${p.downloadUrl}" target="_blank" class="flex-1 bg-emerald-500/10 hover:bg-emerald-500 hover:text-white text-emerald-400 border border-emerald-500/20 transition-all h-9 rounded-lg flex items-center justify-center text-sm font-semibold gap-2">
                                <i data-lucide="download" class="w-4 h-4"></i> Download
                            </a>
                            ${isDev ? `
                                <button onclick="openEditModal('${p.id}')" class="w-9 h-9 flex items-center justify-center rounded-lg border border-white/10 text-white/50 hover:text-emerald-400 hover:border-emerald-500/30 transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button onclick="deletePack('${p.id}')" class="w-9 h-9 flex items-center justify-center rounded-lg border border-white/10 text-white/50 hover:text-rose-400 hover:border-rose-500/30 transition-colors"><i data-lucide="trash" class="w-4 h-4"></i></button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const Header = () => `
            <header class="sticky top-0 z-40 glass-panel border-b border-white/5">
                <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <!-- Logo -->
                    <div class="flex items-center gap-3 relative">
                        <div class="w-9 h-9 rounded-lg bg-emerald-500/10 flex items-center justify-center relative cursor-pointer" onclick="${isDev ? 'toggleDevMenu()' : ''}">
                            <i data-lucide="hexagon" class="w-5 h-5 text-emerald-400"></i>
                            ${isDev ? '<span class="absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>' : ''}
                        </div>
                        <span class="font-bold text-xl text-white tracking-tight hidden sm:block">Galaxy<span class="text-emerald-400">Craft</span></span>
                        
                        ${isDev && isDevMenuOpen ? `
                            <!-- Dev Dropdown -->
                            <div class="absolute top-12 left-0 w-48 bg-card border border-white/10 rounded-xl shadow-2xl py-1 animate-scale-in z-50">
                                <div class="px-3 py-2 border-b border-white/5 mb-1">
                                    <p class="text-[10px] text-white/40 uppercase font-bold tracking-wider">Admin Panel</p>
                                </div>
                                <button onclick="openAddModal()" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-white/70 hover:text-emerald-400 hover:bg-white/5 transition-colors">
                                    <i data-lucide="plus" class="w-4 h-4"></i> Đăng Pack Mới
                                </button>
                                <button onclick="handleLogout()" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-white/70 hover:text-rose-400 hover:bg-white/5 transition-colors">
                                    <i data-lucide="log-out" class="w-4 h-4"></i> Đăng xuất DEV
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- Search Bar (Desktop) -->
                    <div class="hidden md:block flex-1 max-w-md mx-6">
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40"></i>
                            <input type="text" oninput="handleSearchInput(this.value)" placeholder="Tìm kiếm tài nguyên..." class="w-full h-10 modern-input rounded-full pl-10 pr-4 text-sm text-white">
                        </div>
                    </div>

                    <!-- Auth -->
                    <div class="flex items-center gap-4">
                        ${currentUser ? `
                            <div class="flex items-center gap-3">
                                <div class="text-right hidden sm:block">
                                    <p class="text-sm font-semibold text-white">${currentUser.displayName}</p>
                                    <p class="text-[10px] text-emerald-400 font-bold tracking-wider">${isDev ? 'ADMINISTRATOR' : 'MEMBER'}</p>
                                </div>
                                <img src="${currentUser.photoURL}" alt="User" class="w-9 h-9 rounded-full border-2 border-white/10" referrerpolicy="no-referrer">
                                ${!isDev ? `<button onclick="handleLogout()" class="text-white/40 hover:text-white ml-1"><i data-lucide="log-out" class="w-5 h-5"></i></button>` : ''}
                            </div>
                        ` : `
                            <button onclick="handleLogin()" class="h-9 px-4 rounded-lg bg-white text-black text-sm font-semibold hover:bg-gray-200 transition-colors flex items-center gap-2">
                                Đăng nhập
                            </button>
                        `}
                    </div>
                </nav>
            </header>
        `;

        const renderApp = () => {
            document.getElementById('app').innerHTML = `
                ${Header()}
                <main class="w-full">
                    <!-- Hero Section -->
                    <section class="py-24 sm:py-32 relative flex flex-col items-center justify-center text-center px-4">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[300px] bg-emerald-500/10 rounded-full blur-[100px] pointer-events-none"></div>
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold mb-6">
                            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                            Minecraft Premium Hub
                        </div>
                        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight max-w-3xl mb-6">
                            Khám phá <span class="gradient-text">Vũ Trụ Của Bạn</span>
                        </h1>
                        <p class="text-white/50 text-base sm:text-lg max-w-xl mb-10">
                            Nền tảng chia sẻ Mod, Addon và Shader chất lượng cao dành riêng cho cộng đồng Minecraft.
                        </p>
                        
                        <!-- Search (Mobile Only) -->
                        <div class="w-full max-w-md md:hidden mb-8 relative">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40"></i>
                            <input type="text" oninput="handleSearchInput(this.value)" placeholder="Tìm kiếm nội dung..." class="w-full h-12 modern-input rounded-xl pl-11 pr-4 text-sm text-white">
                        </div>
                    </section>

                    <!-- Content Section -->
                    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">
                        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-8">
                            ${["All", "Mod", "Addon", "Texture", "Shader"].map(cat => `
                                <button onclick="handleCategoryFilter('${cat}', event)" class="cat-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors ${cat === 'All' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-white/50 border border-transparent hover:bg-white/5'}">
                                    ${cat}
                                </button>
                            `).join('')}
                        </div>
                        
                        <div id="pack-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
                    </section>
                </main>
                
                <!-- Footer -->
                <footer class="border-t border-white/5 bg-white/[0.01] py-12">
                    <div class="max-w-7xl mx-auto px-4 text-center text-white/30 text-sm">
                        <p>© 2024 Galaxy Craft. All rights reserved.</p>
                    </div>
                </footer>
            `;
            lucide.createIcons();
            renderPackGrid();
            renderSecretContainer();
        };

        renderApp();
    </script>
</body>
</html>
