<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPE Addon - Realtime</title>
    <!-- Font & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* === TỐI ƯU HÓA HIỆU NĂNG - KHÔNG DÙNG BLUR NẶNG === */
        :root {
            --bg-base: #1c1c28; /* Nền sáng hơn bản cũ */
            --bg-card: #28293d;
            --border-color: #00e5ff; /* Viền màu theo yêu cầu */
            --text-main: #ffffff;
            --text-sub: #b5b5c3;
            --dev-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh;
        }

        /* === HEADER === */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            background-color: #1c1c28; /* Nền đặc không gây lag */
            border-bottom: 2px solid var(--border-color); /* Viền nổi bật */
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.1);
        }

        .auth-section { display: flex; align-items: center; gap: 10px; }
        
        .google-btn {
            background: #ffffff; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.2s; border: 2px solid transparent; overflow: hidden;
        }
        .google-btn:hover { border-color: var(--border-color); transform: scale(1.05); }
        .google-btn i { color: #ea4335; font-size: 1.2rem; }
        .google-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* Nút đăng bài ẩn/hiện theo trạng thái đăng nhập */
        #create-btn {
            background: var(--border-color); color: #000; font-weight: bold;
            padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer;
            display: none; /* Ẩn mặc định */
            transition: 0.2s;
        }
        #create-btn:hover { background: #fff; }

        .logo-title { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; color: var(--border-color); letter-spacing: 1px;}

        /* === THANH TÌM KIẾM === */
        .search-area { padding: 20px; max-width: 800px; margin: 0 auto; }
        .search-bar { position: relative; }
        .search-bar input {
            width: 100%; background: var(--bg-card); 
            border: 2px solid #3f3f5a; /* Viền khung mặc định */
            padding: 14px 20px 14px 45px; border-radius: 15px; color: white;
            font-size: 1rem; outline: none; transition: 0.2s;
        }
        /* Viền sáng lên khi click */
        .search-bar input:focus { border-color: var(--border-color); box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        /* === GRID BÀI VIẾT TỪ FIREBASE === */
        .addon-container {
            padding: 0 20px 40px; max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
        }

        .addon-card {
            background: var(--bg-card); 
            border: 2px solid #3f3f5a; /* Khung viền */
            border-radius: 15px; overflow: hidden;
            transition: 0.2s; /* Rút ngắn animation cho nhạy */
            will-change: transform;
        }
        .addon-card:hover { 
            border-color: var(--border-color); /* Đổi màu viền khi hover */
            transform: translateY(-4px); 
        }

        .card-img-wrapper { width: 100%; height: 180px; overflow: hidden; }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        
        /* Huy hiệu DEV */
        .author-line { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); }
        .dev-badge {
            background-color: var(--dev-red); color: white;
            padding: 2px 6px; border-radius: 5px; font-size: 0.7rem; font-weight: bold;
        }

        /* === MODAL ĐĂNG BÀI === */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.2s; z-index: 999;
        }
        .modal.show { opacity: 1; visibility: visible; }
        .modal-body {
            background: var(--bg-base); width: 90%; max-width: 400px; padding: 25px;
            border-radius: 15px; border: 2px solid var(--border-color);
        }
        .modal-body h2 { margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-card);
            border: 1px solid #3f3f5a; color: white; outline: none;
        }
        .input-group input:focus { border-color: var(--border-color); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn-cancel { background: #3f3f5a; color: white; }
        .btn-submit { background: var(--border-color); color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="auth-section">
            <div class="google-btn" id="login-btn" title="Đăng nhập Google">
                <i class="fab fa-google"></i>
            </div>
            <!-- Dấu cộng dời lên đây, gọn gàng -->
            <button id="create-btn"><i class="fas fa-plus"></i></button>
        </div>
        
        <div class="logo-title">MCPE Addon</div>
        
        <!-- Đồng hồ mini -->
        <div id="clock" style="font-size: 0.85rem; font-weight: 600;">00:00</div>
    </header>

    <div class="search-area">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Tìm kiếm...">
        </div>
    </div>

    <!-- Nơi hiển thị dữ liệu từ Firebase -->
    <main class="addon-container" id="feed-container">
        <p style="text-align: center; width: 100%; color: var(--text-sub);">Đang tải dữ liệu từ server...</p>
    </main>

    <!-- Modal Đăng bài (Ẩn) -->
    <div class="modal" id="postModal">
        <div class="modal-body">
            <h2>Đăng Addon Mới</h2>
            <div class="input-group">
                <input type="text" id="titleInput" placeholder="Tên Addon / Map">
            </div>
            <div class="input-group">
                <input type="text" id="imgInput" placeholder="Link ảnh minh họa">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal-btn">Hủy</button>
                <button class="btn btn-submit" id="submit-post-btn">Đăng lên</button>
            </div>
        </div>
    </div>

    <!-- Tích hợp Firebase Web Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 1. Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDImqkipwn1Rm7BUS0Su9fpd9gnKXcN7jw",
            authDomain: "addonshare-c1ffd.firebaseapp.com",
            databaseURL: "https://addonshare-c1ffd-default-rtdb.firebaseio.com",
            projectId: "addonshare-c1ffd",
            storageBucket: "addonshare-c1ffd.firebasestorage.app",
            messagingSenderId: "561066582050",
            appId: "1:561066582050:web:bacecfc6610a8516066a7b",
            measurementId: "G-TFQXBNRNYJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        // Client ID của bạn (Google Provider tự cấu hình ẩn, có thể set parameter nếu cần)
        const provider = new GoogleAuthProvider();

        // 2. Trạng thái người dùng
        let currentUser = null;
        const loginBtn = document.getElementById('login-btn');
        const createBtn = document.getElementById('create-btn');

        // Theo dõi đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Hiện Avatar
                loginBtn.innerHTML = `<img src="${user.photoURL}" alt="avatar">`;
                loginBtn.title = "Đăng xuất";
                // Hiện nút đăng bài
                createBtn.style.display = 'block';
            } else {
                currentUser = null;
                // Trở lại icon Google
                loginBtn.innerHTML = `<i class="fab fa-google"></i>`;
                loginBtn.title = "Đăng nhập Google";
                // Ẩn nút đăng bài
                createBtn.style.display = 'none';
            }
        });

        // Xử lý nút Đăng nhập / Đăng xuất
        loginBtn.addEventListener('click', () => {
            if (currentUser) {
                if(confirm("Bạn muốn đăng xuất?")) signOut(auth);
            } else {
                signInWithPopup(auth, provider).catch(err => alert("Lỗi đăng nhập: " + err.message));
            }
        });

        // 3. Realtime Database: Đọc dữ liệu (Lắng nghe thời gian thực)
        const feedContainer = document.getElementById('feed-container');
        const postsRef = ref(db, 'addons'); // Bảng 'addons' trong Firebase

        onValue(postsRef, (snapshot) => {
            feedContainer.innerHTML = ''; // Xóa chữ "Đang tải..."
            
            const data = snapshot.val();
            if (data) {
                // Đảo ngược mảng để bài mới nhất lên đầu
                const posts = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                
                posts.forEach(post => {
                    // Logic Huy hiệu DEV màu đỏ
                    let devBadge = '';
                    if (post.email === 'hminhgalaxy@gmail.com') {
                        devBadge = `<span class="dev-badge">DEV</span>`;
                    }

                    // Render thẻ UI
                    const card = document.createElement('article');
                    card.className = 'addon-card';
                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${post.image}" alt="Img">
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${post.title}</h3>
                            <div class="author-line">
                                <span>Bởi: ${post.author}</span>
                                ${devBadge}
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            } else {
                feedContainer.innerHTML = '<p style="color:var(--text-sub); width:100%; text-align:center;">Chưa có bài viết nào.</p>';
            }
        });

        // 4. Modal logic (Đăng bài)
        const modal = document.getElementById('postModal');
        createBtn.addEventListener('click', () => modal.classList.add('show'));
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.remove('show'));

        // Đẩy dữ liệu lên Firebase
        document.getElementById('submit-post-btn').addEventListener('click', () => {
            const title = document.getElementById('titleInput').value.trim();
            let img = document.getElementById('imgInput').value.trim();
            
            if (!title) return alert("Vui lòng nhập tiêu đề!");
            if (!img) img = "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?w=600";

            // Push dữ liệu
            const newPostRef = push(postsRef);
            set(newPostRef, {
                title: title,
                image: img,
                author: currentUser.displayName,
                email: currentUser.email, // Lưu email để check DEV
                createdAt: serverTimestamp()
            }).then(() => {
                // Thành công: Đóng form và reset
                modal.classList.remove('show');
                document.getElementById('titleInput').value = '';
                document.getElementById('imgInput').value = '';
            }).catch(err => {
                alert("Lỗi khi đăng: " + err.message);
            });
        });

        // 5. Đồng hồ mini nhẹ nhàng
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').innerText = d.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
        }, 1000);
    </script>
</body>
</html>
