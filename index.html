<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galaxy Craft - Nền tảng chia sẻ Mod, Addon, Texture Pack Minecraft cao cấp." />
    <title>Galaxy Craft | Premium Minecraft Hub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M12 2L2 7L12 12L22 7L12 2Z' fill='%2322C55E'/><path d='M2 17L12 22L22 17' stroke='%2322C55E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#050506', surface: '#0A0E0C', card: '#0E1310', border: 'rgba(34, 197, 94, 0.15)',
                        'text-main': '#FFFFFF', 'text-muted': '#7A8B80',
                        accent: '#22C55E', 'accent-hover': '#00FF85',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    boxShadow: { 
                        'soft': '0 4px 20px rgba(0,0,0,0.5)', 
                        'glow': '0 0 20px rgba(34, 197, 94, 0.3)',
                        'glow-strong': '0 0 40px rgba(34, 197, 94, 0.6)'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #050506; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.08), transparent 60%);
            background-attachment: fixed;
            margin: 0; padding: 0;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #050506; }
        ::-webkit-scrollbar-thumb { background: #22C55E50; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #22C55E; }
        *:focus-visible { outline: none; box-shadow: 0 0 0 2px #050506, 0 0 0 4px #00FF85; border-radius: 4px; }
        
        .glass { 
            background: rgba(10, 14, 12, 0.8); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-bottom: 1px solid rgba(34, 197, 94, 0.1);
        }
        .grid-bg { 
            background-image: linear-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.05) 1px, transparent 1px); 
            background-size: 50px 50px; 
        }
        .gradient-text { 
            background: clip-text; -webkit-background-clip: text; color: transparent; 
            background-image: linear-gradient(to right, #FFFFFF, #22C55E); 
        }
        
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(50px); } 100% { opacity: 1; transform: translateX(0); } }
        .animate-slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* Intro Responsive */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: opacity 1s ease-out, visibility 1s;
            width: 100%; height: 100vh;
        }
        #intro-overlay.hidden-intro { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-text {
            font-size: clamp(2.5rem, 12vw, 7rem);
            font-weight: 900; letter-spacing: -0.05em;
            background: linear-gradient(to right, #FFFFFF, #22C55E);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            z-index: 10; animation: introFade 3s ease-out forwards;
            text-shadow: 0 0 50px rgba(34, 197, 94, 0.6);
            position: relative; text-align: center; width: 100%;
            padding: 0 20px;
        }
        .intro-text::after {
            content: 'GALAXY CRAFT'; position: absolute; top: 0; left: 0; right: 0;
            color: transparent; -webkit-text-stroke: 1px rgba(34, 197, 94, 0.3);
            z-index: -1; transform: scale(1.1); filter: blur(5px);
        }
        @keyframes introFade {
            0% { opacity: 0; transform: scale(0.8); letter-spacing: 0.1em; }
            20% { opacity: 1; transform: scale(1); letter-spacing: -0.05em; }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); filter: blur(10px); }
        }

        /* Realistic Meteors */
        .meteor {
            position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(34, 197, 94, 0.8), 0 0 20px 4px rgba(34, 197, 94, 0.4);
            opacity: 0;
        }
        .meteor::after {
            content: ''; position: absolute; top: 50%; right: 0;
            width: 150px; height: 2px;
            background: linear-gradient(to left, rgba(34, 197, 94, 1), rgba(34, 197, 94, 0.4), transparent);
            transform: translateY(-50%) rotate(-45deg);
            transform-origin: right center;
            border-radius: 2px;
            filter: blur(1px);
        }
        @keyframes meteorFly {
            0% { transform: translate(0, 0) rotate(45deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(-100vw, 100vh) rotate(45deg); opacity: 0; }
        }

        /* VIP Card Dynamic UI */
        .vip-card {
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(34, 197, 94, 0.1);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.03);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }
        .vip-card::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(34, 197, 94, 0.1), transparent 40%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1;
        }
        .vip-card:hover::before { opacity: 1; }
        .vip-card:hover {
            border-color: rgba(34, 197, 94, 0.8);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(34, 197, 94, 0.3), 0 0 30px rgba(34, 197, 94, 0.2);
        }

        .btn-glow:hover { box-shadow: 0 0 30px rgba(34, 197, 94, 0.5); }

        /* Dev Shockwave Effect */
        @keyframes shockwave {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 10px; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0; }
        }
        .shockwave {
            position: fixed; top: 50%; left: 50%; width: 100px; height: 100px;
            border: 10px solid #22C55E; border-radius: 50%;
            transform: translate(-50%, -50%) scale(0); z-index: 200; pointer-events: none;
            animation: shockwave 0.8s ease-out forwards;
        }

        /* DEV Modal Space Background */
        .space-modal-bg {
            background: radial-gradient(circle at 50% 50%, rgba(10, 14, 12, 0.95), rgba(5, 5, 6, 0.98));
            position: absolute; inset: 0; overflow: hidden; z-index: -1;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.6; animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="text-white font-sans antialiased">
    
    <!-- INTRO OVERLAY -->
    <div id="intro-overlay">
        <div class="meteor" style="top: 10%; right: 10%; animation: meteorFly 1.5s linear infinite;"></div>
        <div class="meteor" style="top: 30%; right: 30%; animation: meteorFly 2s linear infinite 0.5s;"></div>
        <div class="meteor" style="top: 70%; right: 20%; animation: meteorFly 1.2s linear infinite 1s;"></div>
        <div class="meteor" style="top: 50%; right: 80%; animation: meteorFly 1.8s linear infinite 0.2s;"></div>
        <div class="meteor" style="top: 20%; right: 90%; animation: meteorFly 1.4s linear infinite 0.8s;"></div>
        <div class="meteor" style="top: 80%; right: 60%; animation: meteorFly 1.6s linear infinite 1.2s;"></div>
        <h1 class="intro-text">GalaxyCraft</h1>
    </div>

    <div id="app"></div>
    <div id="modal-root"></div>
    
    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-3 w-full max-w-sm pointer-events-none px-4"></div>

    <!-- SECRET EASTER EGG CONTAINER -->
    <div id="secret-container" class="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-3"></div>

    <!-- Non-module script to hide intro safely -->
    <script>
        setTimeout(() => {
            const intro = document.getElementById('intro-overlay');
            if (intro) intro.classList.add('hidden-intro');
        }, 3000);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBlMGmdcdxzJQ-dYBzw2zzfRTu2vh6GG0",
            authDomain: "goggle-login-39224.firebaseapp.com",
            databaseURL: "https://goggle-login-39224-default-rtdb.firebaseio.com",
            projectId: "goggle-login-39224",
            storageBucket: "goggle-login-39224.firebasestorage.app",
            messagingSenderId: "479026449758",
            appId: "1:479026449758:web:661543f85ebeb7621393cf",
            measurementId: "G-11EF7RQKS3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getDatabase(app);

        let currentUser = null;
        let isDev = false;
        let allPacks = [];
        let currentSearchTerm = "";
        let currentCategory = "All";

        let redDotClicks = 0;
        let devCodeInput = "";
        const targetDevCode = "YYGGG";

        const GoogleLogo = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`;

        window.handleLogin = () => {
            signInWithPopup(auth, provider).catch(err => showToast('error', 'Login Failed', err.message));
        };

        window.handleLogout = () => {
            if (currentUser && !currentUser.googleUid) {
                currentUser = null;
                isDev = false;
                renderApp();
                showToast('info', 'Logged out', 'See you again, Dev!');
            } else {
                signOut(auth).then(() => {
                    currentUser = null;
                    isDev = false;
                    renderApp();
                    showToast('info', 'Logged out', 'See you again!');
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user && !isDev) {
                currentUser = user;
                currentUser.googleUid = user.uid;
                if (user.email === "hminhgalaxy@gmail.com") {
                    isDev = true;
                    showToast('success', 'DEV Access Granted', 'Welcome back, Developer!');
                } else {
                    isDev = false;
                }
                renderApp();
            }
        });

        const packsRef = ref(db, 'galaxy_craft_packs');
        onValue(packsRef, (snapshot) => {
            const data = snapshot.val();
            allPacks = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderPackGrid();
        });

        window.showToast = (type, title, message) => {
            const container = document.getElementById('toast-container');
            const id = `toast-${Math.random().toString(36).substr(2, 9)}`;
            const icons = { success: 'check-circle', error: 'x-circle', warning: 'alert-circle', info: 'info' };
            const colors = { success: 'text-accent', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };

            const toast = document.createElement('div');
            toast.id = id;
            toast.className = "pointer-events-auto p-4 rounded-xl glass border border-accent/20 shadow-soft flex items-center gap-3 animate-scale-in w-full";
            toast.innerHTML = `
                <i data-lucide="${icons[type]}" class="w-6 h-6 flex-shrink-0 ${colors[type]}"></i>
                <div class="flex-1 min-w-0 text-left">
                    <h4 class="font-semibold text-white text-sm">${title}</h4>
                    ${message ? `<p class="text-gray-400 text-xs mt-1">${message}</p>` : ''}
                </div>
                <button class="text-gray-400 hover:text-white transition-colors flex-shrink-0">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            toast.querySelector('button').onclick = () => removeToast(toast);
            setTimeout(() => removeToast(toast), 4000);
        };

        function removeToast(el) {
            if (!el) return;
            el.style.transition = 'opacity 0.3s, transform 0.3s';
            el.style.opacity = '0';
            el.style.transform = 'scale(0.9)';
            setTimeout(() => el.remove(), 300);
        }

        // ==========================================
        // SECRET EASTER EGG & DEV LOGIN
        // ==========================================
        const renderSecretPad = () => {
            const container = document.getElementById('secret-container');
            container.innerHTML = `
                <div class="bg-card border border-accent/30 p-4 rounded-xl shadow-glow-strong flex flex-col items-center gap-3 animate-scale-in w-64">
                    <p class="text-xs text-accent font-semibold tracking-wide text-center">Vui lòng nhập ký hiệu để nhận được đặc quyền DEV quyền năng</p>
                    <div class="flex gap-3">
                        <button onclick="clickDevColor('Y')" class="w-12 h-12 bg-yellow-500/80 hover:bg-yellow-500 rounded-lg transition-colors shadow-md"></button>
                        <button onclick="clickDevColor('G')" class="w-12 h-12 bg-accent/80 hover:bg-accent rounded-lg transition-colors shadow-md"></button>
                    </div>
                    <div class="flex gap-1.5 mt-1">
                        <div id="dot-0" class="w-2 h-2 bg-gray-700 rounded-full"></div>
                        <div id="dot-1" class="w-2 h-2 bg-gray-700 rounded-full"></div>
                        <div id="dot-2" class="w-2 h-2 bg-gray-700 rounded-full"></div>
                        <div id="dot-3" class="w-2 h-2 bg-gray-700 rounded-full"></div>
                        <div id="dot-4" class="w-2 h-2 bg-gray-700 rounded-full"></div>
                    </div>
                    <button onclick="resetSecret()" class="text-[10px] text-gray-500 hover:text-white">Hủy</button>
                </div>
            `;
        };

        window.clickRedDot = () => {
            redDotClicks++;
            if (redDotClicks >= 5) renderSecretPad();
        };

        window.clickDevColor = (color) => {
            devCodeInput += color;
            const index = devCodeInput.length - 1;
            const dot = document.getElementById(`dot-${index}`);
            if (dot) dot.className = `w-2 h-2 rounded-full ${color === 'Y' ? 'bg-yellow-500' : 'bg-accent'}`;

            if (devCodeInput.length === 5) {
                if (devCodeInput === targetDevCode) openSecretDevLogin();
                else {
                    showToast('error', 'Sai ký hiệu', 'Trình tự không chính xác. Thử lại sau!');
                    resetSecret();
                }
            }
        };

        window.resetSecret = () => {
            redDotClicks = 0;
            devCodeInput = "";
            renderSecretContainer();
        };

        const renderSecretContainer = () => {
            document.getElementById('secret-container').innerHTML = `
                <div onclick="clickRedDot()" class="w-4 h-4 bg-red-500/40 hover:bg-red-500 rounded-full cursor-pointer transition-all duration-300 shadow-md"></div>
            `;
        };

        const openSecretDevLogin = () => {
            document.getElementById('secret-container').innerHTML = '';
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-[110] flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/90 backdrop-blur-md"></div>
                    <div class="relative bg-card border border-accent/30 rounded-2xl shadow-glow-strong w-full max-w-md p-8 animate-scale-in">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 mx-auto rounded-full bg-accent/10 border border-accent/30 flex items-center justify-center mb-4 shadow-glow">
                                <i data-lucide="terminal" class="w-8 h-8 text-accent"></i>
                            </div>
                            <h3 class="text-2xl font-black text-white tracking-tight">CỔNG ĐĂNG NHẬP DEV</h3>
                            <p class="text-xs text-accent mt-1 tracking-widest">QUYỀN NĂNG TỐI THƯỢNG</p>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Dev Email</label>
                                <input id="dev-email" type="email" class="w-full h-12 bg-surface border border-border rounded-lg px-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent" placeholder="dev@galaxycraft.com">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Mật Khẩu</label>
                                <input id="dev-pass" type="password" class="w-full h-12 bg-surface border border-border rounded-lg px-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent" placeholder="••••••••">
                            </div>
                        </div>
                        <button onclick="handleSecretDevLogin()" class="btn-glow w-full mt-8 bg-accent text-bg font-bold h-12 rounded-lg hover:bg-accent-hover transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="unlock" class="w-5 h-5"></i> KÍCH HOẠT QUYỀN NĂNG
                        </button>
                        <button onclick="closeDevModal()" class="w-full mt-2 text-gray-500 hover:text-white text-xs py-2">Hủy</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        window.handleSecretDevLogin = () => {
            const email = document.getElementById('dev-email').value;
            const pass = document.getElementById('dev-pass').value;
            
            const devAccounts = [
                { email: "hminhgalaxycraft@gmail.com", pass: "hoangminhbf2011", name: "Hoàng Minh Galaxy" },
                { email: "tquangalaxycraft@gmail.com", pass: "tquangalaxy2011", name: "TQuan Galaxy" }
            ];

            const validDev = devAccounts.find(acc => acc.email === email && acc.pass === pass);

            if (validDev) {
                currentUser = {
                    displayName: validDev.name,
                    email: validDev.email,
                    photoURL: "https://api.dicebear.com/7.x/bottts/svg?seed=" + validDev.email + "&backgroundColor=22C55E",
                    uid: "local_dev_" + validDev.email
                };
                isDev = true;
                
                const shockwave = document.createElement('div');
                shockwave.className = 'shockwave';
                document.body.appendChild(shockwave);
                setTimeout(() => shockwave.remove(), 800);
                
                showToast('success', 'DEV QUYỀN NĂNG ĐÃ KÍCH HOẠT', `Chào mừng ${validDev.name}!`);
                closeDevModal();
                renderApp();
            } else {
                showToast('error', 'Truy cập bị từ chối', 'Sai tài khoản hoặc mật khẩu DEV');
            }
        };

        window.closeDevModal = () => { 
            document.getElementById('modal-root').innerHTML = ''; 
            resetSecret();
        };

        // ==========================================
        // DEV CRUD FUNCTIONS
        // ==========================================
        window.openAddModal = () => { renderDevModal(null); };
        window.openEditModal = (id) => {
            const pack = allPacks.find(p => p.id === id);
            if (pack) renderDevModal(pack);
        };

        window.updateImagePreview = (url) => {
            const img = document.getElementById('image-preview');
            const placeholder = document.getElementById('image-placeholder');
            if (url) {
                img.src = url;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        };

        window.savePack = (id) => {
            const title = document.getElementById('pack-title').value;
            const description = document.getElementById('pack-desc').value;
            const category = document.getElementById('pack-cat').value;
            const imageUrl = document.getElementById('pack-img-input').value;
            const downloadUrl = document.getElementById('pack-link').value;

            if (!title || !downloadUrl) {
                showToast('error', 'Lỗi', 'Tên và Link tải xuống là bắt buộc.');
                return;
            }

            const packData = { title, description, category, imageUrl, downloadUrl, updatedAt: Date.now() };

            if (id) {
                update(ref(db, `galaxy_craft_packs/${id}`), packData).then(() => {
                    showToast('success', 'Đã cập nhật', `${title} đã được lưu.`);
                    closeDevModal();
                }).catch(err => showToast('error', 'Lỗi Database', 'Vui lòng kiểm tra Rules Firebase'));
            } else {
                push(ref(db, 'galaxy_craft_packs'), { ...packData, createdAt: Date.now(), author: currentUser.displayName }).then(() => {
                    showToast('success', 'Đã thêm Pack', `${title} đã lên sóng.`);
                    closeDevModal();
                }).catch(err => showToast('error', 'Lỗi Database', 'Vui lòng kiểm tra Rules Firebase'));
            }
        };

        window.deletePack = (id) => {
            if (!confirm("Bạn có chắc chắn muốn xóa pack này?")) return;
            remove(ref(db, `galaxy_craft_packs/${id}`)).then(() => {
                showToast('warning', 'Đã xóa', 'Pack đã bị gỡ bỏ.');
            }).catch(err => showToast('error', 'Lỗi Database', 'Vui lòng kiểm tra Rules Firebase'));
        };

        // ==========================================
        // SEARCH & FILTER
        // ==========================================
        let searchDebounce;
        window.handleSearchInput = (val) => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                currentSearchTerm = val.toLowerCase();
                renderPackGrid();
            }, 300);
        };

        window.handleCategoryFilter = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('bg-accent/10', 'text-accent', 'border-transparent'));
            event.currentTarget.classList.add('bg-accent/10', 'text-accent', 'border-transparent');
            renderPackGrid();
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const Header = () => {
            const user = currentUser;
            return `
                <header class="sticky top-0 z-40 glass w-full">
                    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between h-16">
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <div class="relative w-9 h-9 rounded-lg bg-accent/10 border border-accent/30 flex items-center justify-center shadow-glow">
                                    <i data-lucide="box" class="w-5 h-5 text-accent"></i>
                                </div>
                                <span class="font-bold text-xl text-white hidden sm:block tracking-tight">Galaxy<span class="text-accent">Craft</span></span>
                            </div>
                            
                            <div class="flex-1 max-w-md mx-4 hidden md:block">
                                <div class="relative group w-full">
                                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-accent transition-colors pointer-events-none"></i>
                                    <input type="text" oninput="handleSearchInput(this.value)" placeholder="Tìm kiếm mod, addon..." class="w-full h-10 bg-surface border border-border rounded-lg pl-10 pr-4 text-sm text-white placeholder:text-gray-600 focus:border-accent focus:ring-1 focus:ring-accent transition-all" />
                                </div>
                            </div>

                            <div class="flex items-center gap-4 flex-shrink-0">
                                ${isDev ? `<button onclick="openAddModal()" class="hidden sm:flex items-center gap-2 text-sm bg-accent/10 text-accent px-3 py-2 rounded-lg hover:bg-accent/20 transition-colors border border-accent/20 shadow-glow whitespace-nowrap"><i data-lucide="plus-circle" class="w-4 h-4"></i> Thêm Pack</button>` : ''}
                                ${user ? `
                                    <div class="flex items-center gap-3">
                                        <div class="text-right hidden sm:block">
                                            <p class="text-sm font-medium text-white flex items-center justify-end gap-1.5 whitespace-nowrap">${user.displayName} ${isDev ? '<span class="bg-yellow-500/20 text-yellow-400 text-[10px] px-1.5 py-0.5 rounded-full font-bold border border-yellow-500/30 animate-pulse">DEV</span>' : ''}</p>
                                            <p class="text-xs text-gray-500">Premium Member</p>
                                        </div>
                                        <div class="relative flex-shrink-0">
                                            <img src="${user.photoURL}" alt="avatar" class="w-9 h-9 rounded-full border-2 border-accent/50 bg-surface" referrerpolicy="no-referrer" />
                                            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-accent rounded-full border-2 border-bg"></span>
                                        </div>
                                        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-500 p-2 transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                                    </div>
                                ` : `
                                    <button onclick="handleLogin()" class="inline-flex items-center justify-center font-medium rounded-lg transition-all duration-200 active:scale-[0.98] whitespace-nowrap bg-white text-gray-900 hover:bg-gray-100 h-10 px-4 text-sm gap-2 shadow-md hover:shadow-lg">
                                        ${GoogleLogo} Đăng nhập
                                    </button>
                                `}
                            </div>
                        </div>
                    </nav>
                </header>
            `;
        };

        const Hero = () => `
            <section class="relative pt-28 pb-20 overflow-hidden w-full">
                <div class="absolute inset-0 grid-bg" style="mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[500px] bg-accent/10 rounded-full blur-[150px] pointer-events-none"></div>
                
                <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex flex-col items-center justify-center">
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-accent/5 border border-accent/30 text-accent text-[10px] sm:text-xs font-semibold mb-8 animate-fade-in tracking-wider text-center">
                        <span class="w-2 h-2 bg-accent rounded-full animate-pulse"></span> HỆ THỐNG CHIA SẺ MINECRAFT CAO CẤP
                    </div>
                    <h1 class="text-4xl sm:text-6xl lg:text-7xl font-black tracking-tighter max-w-4xl animate-fade-in leading-tight w-full" style="animation-delay: 0.1s; opacity: 0;">
                        <span class="text-white block sm:inline">KHÁM PHÁ</span>
                        <span class="gradient-text block sm:inline">VŨ TRỤ MINECRAFT</span>
                    </h1>
                    <p class="mt-8 text-base sm:text-lg text-gray-400 max-w-2xl mx-auto animate-fade-in w-full" style="animation-delay: 0.2s; opacity: 0;">
                        Trải nghiệm các Mod, Addon, Shader đồ họa cao cấp. Đồng hành cùng hàng ngàn người chơi tại Galaxy Craft.
                    </p>
                    <div class="mt-12 flex flex-col sm:flex-row gap-4 justify-center animate-fade-in w-full sm:w-auto" style="animation-delay: 0.3s; opacity: 0;">
                        <button onclick="document.getElementById('packs-section').scrollIntoView({behavior:'smooth'})" class="btn-glow inline-flex items-center justify-center font-bold rounded-lg transition-all duration-200 active:scale-[0.98] whitespace-nowrap bg-accent text-bg hover:bg-accent-hover h-12 px-8 text-base gap-2 tracking-wide">
                            KHÁM PHÁ NGAY <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </section>
        `;

        const renderPackGrid = () => {
            const gridContainer = document.getElementById('pack-grid');
            if (!gridContainer) return;

            let filteredPacks = allPacks.filter(p => {
                const matchCat = currentCategory === "All" || p.category === currentCategory;
                const matchSearch = !currentSearchTerm || p.title.toLowerCase().includes(currentSearchTerm) || (p.description && p.description.toLowerCase().includes(currentSearchTerm));
                return matchCat && matchSearch;
            });

            if (filteredPacks.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full text-center py-20 border border-dashed border-border rounded-2xl bg-surface/50 flex flex-col items-center">
                        <div class="w-20 h-20 rounded-full bg-surface flex items-center justify-center mb-4 border border-border">
                            <i data-lucide="package-x" class="w-10 h-10 text-gray-600"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-white">Không tìm thấy Pack</h3>
                        <p class="text-sm text-gray-500 mt-2">Thử từ khóa khác hoặc ${isDev ? 'thêm pack mới.' : 'đợi tác giả cập nhật.'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            gridContainer.innerHTML = filteredPacks.map((p, i) => `
                <div class="vip-card bg-card rounded-xl overflow-hidden animate-fade-in" style="animation-delay: ${i * 0.05}s; opacity: 0;" onmousemove="this.style.setProperty('--x', (event.offsetX)+'px'); this.style.setProperty('--y', (event.offsetY)+'px');">
                    <div class="h-48 bg-surface relative overflow-hidden group flex-shrink-0 z-10">
                        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" referrerpolicy="no-referrer">` : `<div class="w-full h-full flex items-center justify-center text-gray-600"><i data-lucide="image" class="w-12 h-12"></i></div>`}
                        <div class="absolute inset-0 bg-gradient-to-t from-card to-transparent opacity-60"></div>
                        <span class="absolute top-3 right-3 bg-bg/80 text-xs px-3 py-1 rounded-full text-accent border border-accent/30 font-medium backdrop-blur-sm flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 bg-accent rounded-full"></span> ${p.category || 'Mod'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col min-w-0 relative z-10">
                        <h3 class="text-lg font-bold text-white mb-2 truncate w-full">${p.title}</h3>
                        <p class="text-sm text-gray-400 line-clamp-2 mb-5 flex-1 w-full">${p.description || 'No description provided.'}</p>
                        <div class="flex items-center justify-between gap-2 mt-auto w-full">
                            <a href="${p.downloadUrl}" target="_blank" class="btn-glow inline-flex items-center justify-center font-semibold rounded-lg transition-all whitespace-nowrap bg-accent text-bg hover:bg-accent-hover h-10 px-4 text-sm gap-2 flex-1">
                                <i data-lucide="download" class="w-4 h-4"></i> Tải xuống
                            </a>
                            ${isDev ? `
                                <button onclick="openEditModal('${p.id}')" class="bg-surface border border-border text-gray-400 hover:text-accent hover:border-accent/30 p-2 rounded-lg h-10 w-10 flex items-center justify-center transition-colors flex-shrink-0"><i data-lucide="edit" class="w-4 h-4"></i></button>
                                <button onclick="deletePack('${p.id}')" class="bg-surface border border-border text-gray-400 hover:text-red-500 hover:border-red-500/30 p-2 rounded-lg h-10 w-10 flex items-center justify-center transition-colors flex-shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const PacksSection = () => `
            <section id="packs-section" class="py-20 relative w-full">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                        <div class="text-center md:text-left w-full md:w-auto">
                            <h2 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Kho Lưu Trữ <span class="text-accent">Packs</span></h2>
                            <p class="text-gray-400 mt-2">Tìm kiếm các bản mod, addon và shader mới nhất.</p>
                        </div>
                        <div class="md:hidden w-full mb-4">
                            <div class="relative group w-full">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-accent pointer-events-none"></i>
                                <input type="text" oninput="handleSearchInput(this.value)" placeholder="Tìm kiếm pack..." class="w-full h-11 bg-surface border border-border rounded-lg pl-10 pr-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent" />
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 justify-center md:justify-end">
                            ${["All", "Mod", "Addon", "Texture", "Shader"].map(cat => `
                                <button onclick="handleCategoryFilter('${cat}')" class="cat-btn px-5 py-2.5 rounded-lg text-sm font-medium border border-border bg-surface text-gray-400 hover:text-white hover:border-accent/30 transition-colors ${cat === 'All' ? 'bg-accent/10 text-accent border-transparent shadow-glow' : ''}">${cat}</button>
                            `).join('')}
                        </div>
                    </div>

                    <div id="pack-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </section>
        `;

        const Footer = () => `
            <footer class="border-t border-border py-12 bg-surface/50 mt-20 backdrop-blur-sm w-full">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center text-center md:text-left md:items-start">
                    <div class="flex flex-col md:flex-row justify-between gap-8 w-full">
                        <div class="max-w-xs flex flex-col items-center md:items-start">
                            <div class="flex items-center gap-2 mb-4">
                                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/30 flex items-center justify-center">
                                    <i data-lucide="box" class="w-4 h-4 text-accent"></i>
                                </div>
                                <span class="font-bold text-lg text-white">Galaxy<span class="text-accent">Craft</span></span>
                            </div>
                            <p class="text-sm text-gray-500">Nền tảng chia sẻ nội dung Minecraft minh bạch và ủng hộ tác giả.</p>
                        </div>
                        <div class="flex flex-wrap gap-12 justify-center">
                            <div><h4 class="text-sm font-bold text-white mb-4">Product</h4><ul class="space-y-2 text-sm text-gray-500"><li class="hover:text-accent transition-colors cursor-pointer">Packs</li><li class="hover:text-accent transition-colors cursor-pointer">Mods</li><li class="hover:text-accent transition-colors cursor-pointer">Shaders</li></ul></div>
                            <div><h4 class="text-sm font-bold text-white mb-4">Company</h4><ul class="space-y-2 text-sm text-gray-500"><li class="hover:text-accent transition-colors cursor-pointer">About</li><li class="hover:text-accent transition-colors cursor-pointer">Privacy</li><li class="hover:text-accent transition-colors cursor-pointer">Terms</li></ul></div>
                        </div>
                    </div>
                    <div class="mt-12 pt-8 border-t border-border flex flex-col md:flex-row justify-between items-center gap-4 w-full">
                        <p class="text-xs text-gray-600">© 2024 Galaxy Craft. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        `;

        const renderDevModal = (pack) => {
            const root = document.getElementById('modal-root');
            const isEdit = !!pack;
            
            // Generate realistic stars and meteors for modal background
            let starsHTML = '';
            for(let i=0; i<50; i++) {
                starsHTML += `<div class="star" style="top: ${Math.random()*100}%; left: ${Math.random()*100}%; width: ${Math.random()*2+1}px; height: ${Math.random()*2+1}px; animation-delay: ${Math.random()*3}s;"></div>`;
            }
            
            root.innerHTML = `
                <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeDevModal()"></div>
                    
                    <!-- Space Background Dynamic -->
                    <div class="space-modal-bg">
                        ${starsHTML}
                        <div class="meteor" style="top: 20%; right: 10%; animation: meteorFly 2s linear infinite;"></div>
                        <div class="meteor" style="top: 70%; right: 50%; animation: meteorFly 2.5s linear infinite 0.8s;"></div>
                        <div class="meteor" style="top: 40%; right: 80%; animation: meteorFly 1.8s linear infinite 1.5s;"></div>
                    </div>

                    <div class="relative bg-card/90 backdrop-blur-xl border border-accent/30 rounded-2xl shadow-glow-strong w-full max-w-lg p-8 animate-scale-in max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-8">
                            <div>
                                <h3 class="text-2xl font-bold text-white flex items-center gap-2">${isEdit ? '<i data-lucide="edit-3" class="w-6 h-6 text-accent"></i> Edit Pack' : '<i data-lucide="plus-square" class="w-6 h-6 text-accent"></i> Add New Pack'}</h3>
                                <p class="text-sm text-gray-500 mt-1">${isEdit ? 'Cập nhật thông tin Pack' : 'Thêm Pack mới vào Database'}</p>
                            </div>
                            <button onclick="closeDevModal()" class="text-gray-400 hover:text-white p-2 hover:bg-surface rounded-lg transition-colors flex-shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-5">
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Tên Pack *</label>
                                <input id="pack-title" type="text" value="${pack?.title || ''}" class="w-full h-12 bg-surface border border-border rounded-lg px-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent transition-all" placeholder="VD: Shader Realistico">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Thể Loại</label>
                                    <select id="pack-cat" class="w-full h-12 bg-surface border border-border rounded-lg px-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                                        ${["Mod", "Addon", "Texture", "Shader"].map(c => `<option value="${c}" ${pack?.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Link Tải Xuống *</label>
                                    <input id="pack-link" type="text" value="${pack?.downloadUrl || ''}" class="w-full h-12 bg-surface border border-border rounded-lg px-4 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent transition-all" placeholder="https://mediafire.com/...">
                                </div>
                            </div>
                            
                            <!-- UPLOAD IMAGE WITH + PREVIEW -->
                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Ảnh Mô Phỏng</label>
                                <div onclick="document.getElementById('pack-img-input').focus()" class="relative w-full h-48 bg-surface border border-dashed border-border rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-accent transition-colors group overflow-hidden">
                                    <img id="image-preview" src="${pack?.imageUrl || ''}" class="w-full h-full object-cover absolute inset-0 ${pack?.imageUrl ? '' : 'hidden'}" referrerpolicy="no-referrer">
                                    <div id="image-placeholder" class="${pack?.imageUrl ? 'hidden' : 'flex'} flex-col items-center text-gray-500 group-hover:text-accent z-10">
                                        <div class="w-12 h-12 rounded-full bg-bg/50 border border-border flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                            <i data-lucide="plus" class="w-6 h-6"></i>
                                        </div>
                                        <span class="text-sm">Bấm để dán URL ảnh mô phỏng</span>
                                    </div>
                                </div>
                                <input id="pack-img-input" oninput="updateImagePreview(this.value)" type="text" value="${pack?.imageUrl || ''}" class="w-full h-10 mt-2 bg-surface border border-border rounded-lg px-4 text-xs text-white focus:border-accent focus:ring-1 focus:ring-accent" placeholder="Dán link ảnh vào đây...">
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Mô Tả</label>
                                <textarea id="pack-desc" rows="3" class="w-full bg-surface border border-border rounded-lg px-4 py-3 text-sm text-white focus:border-accent focus:ring-1 focus:ring-accent transition-all" placeholder="Mô tả ngắn gọn về pack...">${pack?.description || ''}</textarea>
                            </div>
                        </div>
                        <div class="mt-8 flex justify-end gap-3">
                            <button onclick="closeDevModal()" class="bg-surface border border-border text-white font-medium h-12 px-6 rounded-lg hover:bg-bg transition-colors">Hủy</button>
                            <button onclick="savePack('${pack?.id || ''}')" class="btn-glow bg-accent text-bg font-bold h-12 px-6 rounded-lg hover:bg-accent-hover transition-colors flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Lưu Pack</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        // ==========================================
        // MAIN RENDER
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                ${Header()}
                <main class="w-full overflow-hidden">
                    ${Hero()}
                    ${PacksSection()}
                    ${Footer()}
                </main>
            `;
            lucide.createIcons();
            renderPackGrid();
            renderSecretContainer();
        }

        // Initial Render before Firebase loads
        renderApp();
    </script>
</body>
</html>
